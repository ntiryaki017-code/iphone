  if(kartCompact)kartCompact.style.background=bgHari;

  // ───── Compact mode (Ozet sayfasinda kucuk kart) ─────
  if(kartCompact&&!kartFull){
    var ikonBuyuk=_havaIkon(kod);
    k.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center">'+
      '<div>'+
        '<div style="font-size:11px;opacity:0.9;font-weight:600">'+cache.city+'</div>'+
        '<div style="font-size:42px;font-weight:200;line-height:1.05;margin-top:2px">'+sicaklik+'&deg;</div>'+
        '<div style="font-size:12px;opacity:0.95;margin-top:2px">'+aciklama+'</div>'+
        '<div style="font-size:11px;opacity:0.85;margin-top:2px">Y:'+bugunMax+'&deg; A:'+bugunMin+'&deg;</div>'+
      '</div>'+
      '<div style="font-size:64px;line-height:1">'+ikonBuyuk+'</div>'+
    '</div>';
    return;
  }

  // ───── Full mode (Hava sayfasi p9 — iPhone tarzi) ─────
  // ÜST: Sehir, sicaklik, aciklama, H/L
  var html='<div style="text-align:center;padding:20px 12px 18px 12px">'+
    '<div style="font-size:24px;font-weight:500;letter-spacing:-0.3px">'+cache.city+'</div>'+
    '<div style="font-size:88px;font-weight:200;line-height:1.05;letter-spacing:-3px;margin-top:6px">'+sicaklik+'&deg;</div>'+
    '<div style="font-size:18px;font-weight:500;opacity:0.95;margin-top:2px">'+aciklama+'</div>'+

      (DIL==='en'?'H':'Y')+':'+bugunMax+'&deg;&nbsp;&nbsp;'+(DIL==='en'?'L':'A')+':'+bugunMin+'&deg;'+
    '</div>'+
  '</div>';

  // SAATLIK forecast (yatay scroll, 24 saat)
  var saatlikHtml='';
  if(h.time&&h.time.length){
    var simdi=Date.now();
    var sayim=0;
    for(var hi=0;hi<h.time.length&&sayim<24;hi++){
      var tsMs=new Date(h.time[hi]).getTime();
      if(tsMs<simdi-30*60*1000)continue; // gecmis saatleri atla
      var hKod=h.weather_code?h.weather_code[hi]:0;
      var hGn=h.is_day?h.is_day[hi]===1:true;
      var hT=Math.round(h.temperature_2m?h.temperature_2m[hi]:0);
      var lbl=sayim===0?(DIL==='en'?'Now':'Simdi'):_havaSaat(h.time[hi]);
      saatlikHtml+='<div style="flex-shrink:0;text-align:center;padding:10px 12px;min-width:54px">'+
        '<div style="font-size:13px;font-weight:600;opacity:0.95">'+lbl+'</div>'+
        '<div style="font-size:24px;margin:6px 0">'+_havaIkon(hKod)+'</div>'+
        '<div style="font-size:16px;font-weight:600">'+hT+'&deg;</div>'+
      '</div>';
      sayim++;
    }
  }
  if(saatlikHtml){
    html+='<div style="margin:0 12px 12px 12px;background:rgba(255,255,255,0.18);border-radius:18px;padding:8px 4px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15)">'+
      '<div style="font-size:11px;font-weight:600;opacity:0.85;padding:4px 14px 6px 14px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid rgba(255,255,255,0.15);margin-bottom:4px">'+
        (DIL==='en'?'Hourly Forecast':'Saatlik Tahmin')+
      '</div>'+
      '<div style="display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch">'+saatlikHtml+'</div>'+
    '</div>';
  }

  // GUNLUK forecast (7 gun, dikey liste)
  if(d.time&&d.time.length){
    // Tum gunlerin min/max'ini bul (bar olcekleme icin)
    var tumMin=Infinity,tumMax=-Infinity;
    for(var di=0;di<d.time.length;di++){
      tumMin=Math.min(tumMin,d.temperature_2m_min[di]);
      tumMax=Math.max(tumMax,d.temperature_2m_max[di]);
    }
    var arasi=tumMax-tumMin||1;
    var gunSatir='';
    for(var di2=0;di2<Math.min(d.time.length,7);di2++){
      var gAd=_havaGunAd(d.time[di2],di2);
      var gMax=Math.round(d.temperature_2m_max[di2]);

        '</div>'+
        '<div style="flex:0 0 36px;text-align:right;font-size:14px;opacity:0.75">'+gMin+'&deg;</div>'+
        '<div style="flex:1;margin:0 10px;height:5px;background:rgba(255,255,255,0.18);border-radius:3px;position:relative;overflow:hidden">'+
          '<div style="position:absolute;left:'+solY+'%;width:'+bGen+'%;height:100%;background:linear-gradient(90deg,#ffd166,#ef476f);border-radius:3px"></div>'+
        '</div>'+
        '<div style="flex:0 0 36px;text-align:right;font-size:14px;font-weight:600">'+gMax+'&deg;</div>'+
      '</div>';
    }
    html+='<div style="margin:0 12px 12px 12px;background:rgba(255,255,255,0.18);border-radius:18px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15)">'+
      '<div style="font-size:11px;font-weight:600;opacity:0.85;padding:8px 14px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid rgba(255,255,255,0.15)">'+
        (DIL==='en'?'7-Day Forecast':'7 Gunluk Tahmin')+
      '</div>'+
      gunSatir+
    '</div>';
  }

  // DETAY KARTLARI (2x3 grid)
  function detKart(baslik,deger,ekstra){
    return '<div style="background:rgba(255,255,255,0.18);border-radius:14px;padding:12px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15)">'+
      '<div style="font-size:10px;font-weight:600;opacity:0.8;text-transform:uppercase;letter-spacing:0.5px">'+baslik+'</div>'+
      '<div style="font-size:24px;font-weight:500;margin-top:8px">'+deger+'</div>'+
      (ekstra?'<div style="font-size:11px;opacity:0.85;margin-top:2px">'+ekstra+'</div>':'')+
    '</div>';
  }
  var dogus='',batis='',uv='';
  try{
    if(d.sunrise&&d.sunrise[0]){
      var sr=new Date(d.sunrise[0]);dogus=(sr.getHours()<10?'0':'')+sr.getHours()+':'+(sr.getMinutes()<10?'0':'')+sr.getMinutes();
    }
    if(d.sunset&&d.sunset[0]){
      var ss=new Date(d.sunset[0]);batis=(ss.getHours()<10?'0':'')+ss.getHours()+':'+(ss.getMinutes()<10?'0':'')+ss.getMinutes();
    }
    uv=d.uv_index_max&&d.uv_index_max[0]!=null?Math.round(d.uv_index_max[0]):'-';
  }catch(e){}
  var uvText=function(u){
    if(u==='-')return '';
    if(u<=2)return DIL==='en'?'Low':'Dusuk';
    if(u<=5)return DIL==='en'?'Moderate':'Orta';
    if(u<=7)return DIL==='en'?'High':'Yuksek';
    if(u<=10)return DIL==='en'?'Very High':'Cok Yuksek';
    return DIL==='en'?'Extreme':'Asiri';
  };

  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 12px 12px 12px">'+
    detKart(DIL==='en'?'Feels Like':'Hissedilen',hisstaki+'&deg;')+
    detKart(DIL==='en'?'Humidity':'Nem','%'+nem)+
    detKart(DIL==='en'?'Wind':'Ruzgar',ruzgar+' <span style=\"font-size:14px;font-weight:400\">km/h</span>')+
    detKart('UV',uv,uvText(uv))+

    detKart(DIL==='en'?'Updated':'Guncellendi',new Date(cache.ts).toLocaleTimeString(DIL==='en'?'en-US':'tr-TR',{hour:'2-digit',minute:'2-digit'}))+
  '</div>';

  // Alt bilgi
  html+='<div style="text-align:center;font-size:10px;opacity:0.7;padding:8px 12px 16px 12px">'+
    (DIL==='en'?'Data: Open-Meteo · Tap to refresh':'Veri: Open-Meteo · Yenilemek icin dokun')+
  '</div>';

  k.innerHTML=html;
}

// Turkce -> ASCII (jsPDF varsayilan fontunda render guvencesi)
function _trAscii(s){
  if(s===null||s===undefined)return '';
  s=String(s);
  return s
    .replace(/ı/g,'i').replace(/İ/g,'I')
    .replace(/ğ/g,'g').replace(/Ğ/g,'G')
    .replace(/ü/g,'u').replace(/Ü/g,'U')
    .replace(/ş/g,'s').replace(/Ş/g,'S')
    .replace(/ö/g,'o').replace(/Ö/g,'O')
    .replace(/ç/g,'c').replace(/Ç/g,'C')
    .replace(/â/g,'a').replace(/î/g,'i').replace(/û/g,'u')
    .replace(/Â/g,'A').replace(/Î/g,'I').replace(/Û/g,'U');
}
function _trArr(arr){return arr.map(function(x){return _trAscii(x);});}

// Tum verileri tek PDF olarak Downloads klasorune kaydet
function tumVeriPdfAktar(){

      var sayfaNo=1;

          doc.setPage(i);

          doc.setTextColor(120);

      }
      // Baslik sayfasi
      doc.setFontSize(22); doc.setTextColor(30,132,73);
      doc.text('Ciftci Takip',105,30,{align:'center'});
      doc.setFontSize(14); doc.setTextColor(80);
      doc.text('Veri Raporu - '+bugun,105,40,{align:'center'});
      doc.setFontSize(11); doc.setTextColor(120);
      var ozet=[
        'Tarla sayisi: '+((V.tarlalar||[]).length),
        'Hasat kaydi: '+((V.hasatKayitlari||[]).length),
        'Gider kaydi: '+((V.giderler||[]).length),
        'Isci kaydi: '+(((V.isci&&V.isci.isciler)||[]).length),
        'Ilac kaydi: '+(((V.ilac&&V.ilac.kayitlar)||[]).length),
        'Gubre kaydi: '+(((V.gubre&&V.gubre.kayitlar)||[]).length)
      ];
      doc.text(ozet,20,60);

      function bolum(baslik,kolonlar,rows,kolonStilleri){
        if(!rows.length)return;
        doc.addPage(); sayfaNo++;
        doc.setFontSize(16); doc.setTextColor(30,132,73);
        doc.text(_trAscii(baslik),14,18);
        // Tum hucreleri Turkce->ASCII
        var safeRows=rows.map(function(r){return r.map(function(c){return _trAscii(c);});});
        var opts={
          startY:24,
          head:[_trArr(kolonlar)],
          body:safeRows,
          styles:{fontSize:8,cellPadding:2,overflow:'linebreak',valign:'middle'},
          headStyles:{fillColor:[39,174,96],textColor:255,fontStyle:'bold',halign:'left'},
          alternateRowStyles:{fillColor:[245,250,245]},
          margin:{left:10,right:10},
          tableWidth:'auto'
        };
        if(kolonStilleri)opts.columnStyles=kolonStilleri;
        doc.autoTable(opts);
      }

      // Tarlalar
      var tl=(V.tarlalar||[]).map(function(t){
        return [t.ad||'',t.meyve||'',(t.agacSayisi||0).toString(),(t.donum||0).toString(),t.not||''];
      });
      bolum('Tarlalar',['Ad','Meyve/Urun','Agac/Fidan','Donum','Not'],tl,{
        0:{cellWidth:40},1:{cellWidth:30},2:{cellWidth:22,halign:'right'},3:{cellWidth:18,halign:'right'},4:{cellWidth:'auto'}
      });

      // Hasat
      var hs=(V.hasatKayitlari||[]).slice().sort(function(a,b){return (b.tarih||'').localeCompare(a.tarih||'');}).map(function(h){
        var t=(V.tarlalar||[])[h.tarlaIndex]||{};
        var tot=getToplam(h);
        var tip=h.girisTipi==='tane'?'Tane':(h.girisTipi==='kg'?'KG':'Kasa');
        var miktar=h.girisTipi==='tane'?(h.tane||0)+' adet':((tot.pk+tot.ak).toFixed(1)+' kg');
        return [h.tarih||'',t.ad||'?',t.meyve||'',tip,miktar,'TL '+f(tot.gel)];
      });
      bolum('Hasat Kayitlari',['Tarih','Tarla','Urun','Tip','Miktar','Gelir'],hs,{
        0:{cellWidth:22},1:{cellWidth:35},2:{cellWidth:28},3:{cellWidth:18},4:{cellWidth:30,halign:'right'},5:{cellWidth:'auto',halign:'right'}
      });

      // Giderler
      var gd=(V.giderler||[]).slice().sort(function(a,b){return (b.tarih||'').localeCompare(a.tarih||'');}).map(function(g){
        return [g.tarih||'',g.kategori||'',g.aciklama||'','TL '+f(g.tutar||0),g.not||''];
      });
      bolum('Gider Kayitlari',['Tarih','Kategori','Aciklama','Tutar','Not'],gd,{
        0:{cellWidth:22},1:{cellWidth:30},2:{cellWidth:55},3:{cellWidth:25,halign:'right'},4:{cellWidth:'auto'}
      });

      // Isci - Gunluk Devam
      var dev=((V.isci&&V.isci.devamlar)||[]).slice().sort(function(a,b){return (b.tarih||'').localeCompare(a.tarih||'');}).map(function(d){
        var w=((V.isci&&V.isci.isciler)||[]).filter(function(i){return i.id===d.isciId;})[0]||{ad:'?'};
        return [d.tarih?d.tarih.split('T')[0]:'',w.ad||'?','TL '+f(d.uygulanenUcret||0)];
      });
      bolum('Isci Gunluk Devam',['Tarih','Isci','Ucret'],dev,{
        0:{cellWidth:30},1:{cellWidth:'auto'},2:{cellWidth:35,halign:'right'}
      });

      // Cavus Odemeleri
      var co=((V.isci&&V.isci.cavusOdemeleri)||[]).slice().sort(function(a,b){return (b.tarih||'').localeCompare(a.tarih||'');}).map(function(o){
        return [o.tarih?o.tarih.split('T')[0]:'','TL '+f(o.tutar||0),o.not||''];
      });
      bolum('Cavus Odemeleri',['Tarih','Tutar','Not'],co,{
        0:{cellWidth:30},1:{cellWidth:30,halign:'right'},2:{cellWidth:'auto'}
      });

      // Ilac
      var il=((V.ilac&&V.ilac.kayitlar)||[]).slice().sort(function(a,b){return (b.tarih||'').localeCompare(a.tarih||'');}).map(function(k){
        var ilaclar=(k.ilaclar||[]).map(function(i){return i.ad||'';}).filter(Boolean).join(', ');
        return [k.tarih||'',k.tarla||(k.tarlalar||[]).join(', '),ilaclar,(k.su||0)+' lt',k.not||''];
      });
      bolum('Ilac Kayitlari',['Tarih','Tarla','Ilaclar','Su','Not'],il,{
        0:{cellWidth:22},1:{cellWidth:35},2:{cellWidth:55},3:{cellWidth:18,halign:'right'},4:{cellWidth:'auto'}
      });

      // Gubre
      var gb=((V.gubre&&V.gubre.kayitlar)||[]).slice().sort(function(a,b){return (b.tarih||'').localeCompare(a.tarih||'');}).map(function(k){
        return [k.tarih||'',k.tarla||(k.tarlalar||[]).join(', '),k.gubreAdi||'',(k.toplamMiktar||0)+' kg',(k.donumMiktar||0)+' kg/don',k.not||''];
      });
      bolum('Gubre Kayitlari',['Tarih','Tarla','Gubre','Toplam','Donume','Not'],gb,{
        0:{cellWidth:22},1:{cellWidth:35},2:{cellWidth:30},3:{cellWidth:20,halign:'right'},4:{cellWidth:22,halign:'right'},5:{cellWidth:'auto'}
      });

      // Altyazi tum sayfalara
      altyazi();

      // PDF base64 olarak al ve Android'e gonder
      var tarih=new Date().toISOString().substring(0,10);
      var dosyaAdi='CiftciTakip_Veriler_'+tarih+'.pdf';
      var b64=doc.output('datauristring').split(',')[1]; // base64 kismi
      if(window.Android&&Android.saveFile){
        var sonuc=Android.saveFile(b64,dosyaAdi,'application/pdf');
        if(sonuc&&sonuc.indexOf('OK:')===0)toast('Indirilenler/'+dosyaAdi+' kaydedildi!');
        else toast('PDF kayit hatasi: '+sonuc);
      } else {
        // Web fallback
        doc.save(dosyaAdi);
        toast('PDF indirildi: '+dosyaAdi);
      }
    }catch(e){toast('PDF olusturma hatasi: '+(e.message||e));}
  },100);
}

function telefonYedekYukle(){
  var inp=document.createElement('input');
  inp.type='file';
  inp.accept='.json,application/json,text/plain,*/*';
  inp.style.cssText='position:fixed;top:-1000px;left:-1000px;opacity:0;width:1px;height:1px';
  document.body.appendChild(inp);
  inp.onchange=function(){
    if(!this.files||!this.files[0])return;
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var yeni=JSON.parse(e.target.result);
        if(!yeni||typeof yeni!=='object'){toast('Gecersiz dosya!');return;}
        V=yeni;
        if(V.bulutAyar){
          BIN_KEY=V.bulutAyar.apiKey||BIN_KEY;
          BIN_ID=V.bulutAyar.binId||BIN_ID;
          OTOKAYT_API=V.bulutAyar.otoKaytApi===true;
        }
        if(window.Android)Android.saveData(JSON.stringify(V));
        try{localStorage.setItem('ciftci_veri',JSON.stringify(V));}catch(le){}
        try{_idbSave(JSON.stringify(V));}catch(ie){}
        toast('Veriler yuklendi!');
        CM();R();
      }catch(err){toast('Dosya okunamadi: '+err.message);}
    };
    reader.readAsText(this.files[0]);
  };
  inp.click();
}

function _tarlaGrupla(tarlalar){
  if(!tarlalar||!tarlalar.length)return '';
  if(tarlalar.length===1)return tarlalar[0];
  // Meyve bazlı grupla
  var meyveler={};
  tarlalar.forEach(function(ta){
    var t=null;var _tg=V.tarlalar||[];for(var _gi=0;_gi<_tg.length;_gi++){if(_tg[_gi].ad===ta){t=_tg[_gi];break;}}
    var m=t&&t.meyve?t.meyve:'diger';
    if(!meyveler[m])meyveler[m]=[];
    meyveler[m].push(ta);
  });
  var parcalar=[];
  Object.keys(meyveler).forEach(function(m){
    var secilen=meyveler[m];
    var tumTarlalar=(V.tarlalar||[]).filter(function(t){return (t.meyve||'diger')===m;}).map(function(t){return t.ad;});
    if(tumTarlalar.length>1&&secilen.length===tumTarlalar.length&&
       secilen.slice().sort().join(',')===tumTarlalar.slice().sort().join(',')){
      parcalar.push('Tum '+m.charAt(0).toUpperCase()+m.slice(1)+'ler ('+secilen.length+')');
    } else {
      parcalar.push(secilen.join(', '));
    }
  });
  return parcalar.join(' | ');
}

// IndexedDB - PWA kalıcı depolama
function _idbSave(json){
  try{
    var req=indexedDB.open('CiftciDB',1);
    req.onupgradeneeded=function(e){e.target.result.createObjectStore('veri',{keyPath:'id'});};
    req.onsuccess=function(e){
      var tx=e.target.result.transaction('veri','readwrite');
      tx.objectStore('veri').put({id:'main',json:json});
    };
  }catch(e){}
}
function _idbLoad(cb){
  try{
    var req=indexedDB.open('CiftciDB',1);
    req.onupgradeneeded=function(e){e.target.result.createObjectStore('veri',{keyPath:'id'});};
    req.onsuccess=function(e){
      var gr=e.target.result.transaction('veri','readonly').objectStore('veri').get('main');
      gr.onsuccess=function(){cb(gr.result?gr.result.json:null);};
      gr.onerror=function(){cb(null);};
    };
    req.onerror=function(){cb(null);};
  }catch(e){cb(null);}
}

</script>
