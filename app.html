<script>
(function(){
  if (!('serviceWorker' in navigator)) return;
  // file:// protokolunde calismaz, sadece http(s)
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      // Yeni surum varsa otomatik yenile
      reg.addEventListener('updatefound', function(){
        var nw = reg.installing;
        if (nw) nw.addEventListener('statechange', function(){
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            // Eski surum aktif, yeni surum kuruldu — sessizce guncelle
            try { nw.postMessage({type:'SKIP_WAITING'}); } catch(e){}
          }
        });
      });
    }).catch(function(err){ console.warn('SW kayit hata:', err); });
  });
  // Controller degisince sayfayi yenile (yeni surum aktif olur)
  var refreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (refreshed) return;
    refreshed = true;
    location.reload();
  });
})();
</script>

    while(n){var nx=n.nextSibling;b.removeChild(n);n=nx;}
    b.appendChild(document.createTextNode(t(map[id])));
  });

  if(ab)ab.innerHTML=(PG===0?'&#128202; '+t('ozet'):'&#127968; '+t('anasayfa'));

  if(hb)hb.textContent=t('hizliMod')+': '+(HIZLI_ERISIM?t('acik'):t('kapali'));
}

// Once cache'i temizle ki yeni anahtarlar etkin olsun
_CEVIRI_KEYS_CACHE=null;

// Sozlukteki anahtarlari uzunluga gore sirala (uzun once -> partial match guvenligi)
var _CEVIRI_KEYS_CACHE=null;
function _ceviriKeys(){
  if(_CEVIRI_KEYS_CACHE)return _CEVIRI_KEYS_CACHE;
  var keys=Object.keys(CEVIRI_HARF);
  keys.sort(function(a,b){return b.length-a.length;});
  _CEVIRI_KEYS_CACHE=keys;
  return keys;
}
// Bir metin parcasini cevir: once tam eslesme, sonra substring/word-boundary
function _ceviriMetin(s){
  if(!s)return s;
  var trimmed=s.replace(/^\s+|\s+$/g,'');
  if(!trimmed)return s;
  if(CEVIRI_HARF[trimmed]){
    var idx=s.indexOf(trimmed);
    return s.substring(0,idx)+CEVIRI_HARF[trimmed]+s.substring(idx+trimmed.length);
  }
  // Anahtar uzunluguna gore strateji:
  // - 6+ karakter: dogrudan substring degistir (cok ozel ifadeler)
  // - 3-5 karakter: kelime siniri ile degistir (kisa ortak kelimeler icin guvenli)
  // - <3: hic kullanma
  var keys=_ceviriKeys();
  var out=s;
  var degisti=false;
  for(var i=0;i<keys.length;i++){
    var k=keys[i];
    if(k.length<2)continue;
    if(out.indexOf(k)<0)continue;
    if(k.length>=6){
      out=out.split(k).join(CEVIRI_HARF[k]);
      degisti=true;
    } else {
      try{
        var esc=k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
        // Turkce karakter dahil alfanumerik dis siniri
        var re=new RegExp('(^|[^A-Za-z0-9_ığüşöçıİĞÜŞÖÇ])'+esc+'(?=$|[^A-Za-z0-9_ığüşöçıİĞÜŞÖÇ])','g');
        var nout=out.replace(re,'$1'+CEVIRI_HARF[k]);
        if(nout!==out){out=nout;degisti=true;}
      }catch(e){}
    }
  }
  return degisti?out:s;
}
function ceviriDOM(node,sadeceTamEslesme){
  if(!node||DIL!=='en')return;
  if(node.nodeType===3){
    var nv=node.nodeValue;
    if(sadeceTamEslesme){
      // Sadece tam eslesme (kullanici verisi olabilir)
      var trimmed=nv.replace(/^\s+|\s+$/g,'');
      if(trimmed&&CEVIRI_HARF[trimmed]){
        var idx=nv.indexOf(trimmed);
        node.nodeValue=nv.substring(0,idx)+CEVIRI_HARF[trimmed]+nv.substring(idx+trimmed.length);
      }
    } else {
      var nv2=_ceviriMetin(nv);
      if(nv2!==nv)node.nodeValue=nv2;
    }
    return;
  }
  if(node.nodeType!==1)return;
  if(/^(SCRIPT|STYLE|TEXTAREA)$/.test(node.nodeName))return;
  // Kullanici verisi iceren elementlerde sadece tam eslesme moduna gec
  var altMod=sadeceTamEslesme;
  if(node.classList&&(node.classList.contains('mn')||node.classList.contains('sb')||node.classList.contains('at'))){
    altMod=true;
  }
  // attribute cevirileri (sadece tam eslesme olanlar zaten _ceviriMetin'in tam-eslesme yolundan gecer)
  ['placeholder','title'].forEach(function(a){
    if(node.hasAttribute&&node.hasAttribute(a)){
      var v=node.getAttribute(a);
      var v2=_ceviriMetin(v);
      if(v2!==v)node.setAttribute(a,v2);
    }
  });
  if(node.nodeName==='OPTION'){
    var optTxt=node.textContent.replace(/^\s+|\s+$/g,'');
    if(optTxt&&CEVIRI_HARF[optTxt])node.textContent=CEVIRI_HARF[optTxt];
  }
  // OPTGROUP label attribute
  if(node.nodeName==='OPTGROUP'){
    var lbl=node.getAttribute('label');
    if(lbl&&CEVIRI_HARF[lbl])node.setAttribute('label',CEVIRI_HARF[lbl]);
  }
  for(var i=0;i<node.childNodes.length;i++)ceviriDOM(node.childNodes[i],altMod);
}
function uygulamaCeviri(){
  if(DIL!=='en')return;
  var roots=[
    document.querySelector('.hdr'),
    document.getElementById('cnt'),
    document.getElementById('sh'),
    document.getElementById('sh2'),
    document.getElementById('hizliErisim'),
    document.querySelector('nav.nav'),
    document.getElementById('anaSayfaBar')
  ];
  for(var i=0;i<roots.length;i++)if(roots[i])ceviriDOM(roots[i]);
}

function _driveApiKaydetToken(txt){
  try{
    var d=typeof txt==='string'?JSON.parse(txt):txt;
    if(d.status!=='ok'){_driveSyncGoster('hata','Hata');toast('Token hatasi: '+(d.message||'?'));return;}
    var token=d.token;
    var veri=_fotoSizKopyala(V);
    var json=JSON.stringify(veri);
    var fileName='CiftciTakip_Yedek.json';
    fetch('https://www.googleapis.com/drive/v3/files?q=name%3D%27CiftciTakip_Yedek.json%27+and+trashed%3Dfalse&fields=files(id)',{
      headers:{'Authorization':'Bearer '+token}
    }).then(function(r){return r.json();}).then(function(res){
      var files=res.files||[];
      if(files.length>0){
        return fetch('https://www.googleapis.com/upload/drive/v3/files/'+files[0].id+'?uploadType=media',{
          method:'PATCH',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:json
        });
      } else {
        var meta=JSON.stringify({name:fileName,mimeType:'application/json'});
        var form=new FormData();
        form.append('metadata',new Blob([meta],{type:'application/json'}));
        form.append('file',new Blob([json],{type:'application/json'}));
        return fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{
          method:'POST',headers:{'Authorization':'Bearer '+token},body:form
        });
      }
    }).then(function(r){
      if(r&&r.ok){_driveSyncGoster('ok','Kaydedildi');toast('Drive\'a kaydedildi!');}
      else{_driveSyncGoster('hata','Hata');toast('Drive kayit hatasi');}
    }).catch(function(e){_driveSyncGoster('hata','Hata');toast('Drive hatasi: '+String(e));});
  }catch(e){_driveSyncGoster('hata','Hata');toast('Drive hatasi: '+String(e));}
}

function ilacBarkodSorgula(barkod16){
  if(!barkod16)return null;
  barkod16=String(barkod16).trim();
  if(barkod16.length<4)return null;
  var key=barkod16.substring(0,16);
  var depo=ilacDepoAl(); // V._ilacDepo + localStorage birlesik
  // 1. Tam eslesme
  if(depo[key])return depo[key];
  // 2. Kismi eslesme - kayitlardaki barkodun bir kismi gelen barkod ise
  for(var k in depo){
    if(k&&(k===key||k.indexOf(key)===0||key.indexOf(k)===0))return depo[k];
  }
  // 3. Check digit olmadan dene (son karakter farkliysa)
  if(barkod16.length>=8){
    var kisaKey=barkod16.substring(0,barkod16.length-1);
    if(depo[kisaKey])return depo[kisaKey];
    for(var k2 in depo){
      if(k2&&(k2.indexOf(kisaKey)===0||kisaKey.indexOf(k2)===0))return depo[k2];
    }
  }
  return null;
}
function ilacBarkodKaydetDepo(barkod16, ticari, etken, doz){
  if(!barkod16)return;
  barkod16=String(barkod16).trim();
  if(barkod16.length<4)return;
  var key=barkod16.substring(0,16);
  var depo=ilacDepoAl();
  depo[key]={ticari:(ticari||'').trim(),etken:(etken||'').trim(),doz:(doz||'').toString().trim()};
  ilacDepoKaydet(depo);
}
function ilacBarkodDegisti(ilacIdx){
  var bEl=document.getElementById('ibk'+ilacIdx);
  if(!bEl)return;
  var barkod=bEl.value.trim();
  if(barkod.length<2)return;
  // Barkod veya ticari isimle ara
  var eslesen=ilacBarkodSorgula(barkod);
  if(!eslesen){
    // Ticari isimle ara
    var depo=ilacDepoAl();
    Object.keys(depo).forEach(function(k){
      if(!eslesen&&depo[k].ticari&&depo[k].ticari.toLowerCase().indexOf(barkod.toLowerCase())===0)
        eslesen=depo[k];
    });
  }
  if(eslesen){
    var tEl=document.getElementById('ilt'+ilacIdx);
    if(tEl&&!tEl.value)tEl.value=eslesen.ticari||'';
    // Etken madde doldur — alan yoksa önce oluştur
    if(eslesen.etken){
      var etkenler=eslesen.etken.split(',');
      for(var ei=0;ei<etkenler.length;ei++){
        var eVal=etkenler[ei].trim();
        if(!eVal)continue;
        // Alan yoksa etkenEkle ile oluştur
        if(!document.getElementById('ile'+ilacIdx+'_'+ei)){
          etkenEkle(ilacIdx);
        }
        var eEl=document.getElementById('ile'+ilacIdx+'_'+ei);
        if(eEl)eEl.value=eVal;
      }
    }
    // Doz alanını doldur
    if(eslesen.doz){
      var dozEl=document.getElementById('ild'+ilacIdx);
      if(dozEl&&!dozEl.value)dozEl.value=eslesen.doz;
    }
    toast('Ilac deposundan bulundu!');
  }
}
function ilacFormKaydetDepo(ilacIdx){
  var bEl=document.getElementById('ibk'+ilacIdx);
  var tEl=document.getElementById('ilt'+ilacIdx);
  if(!bEl||!bEl.value.trim())return;
  var barkod=bEl.value.trim();

  var etkenEls=document.querySelectorAll('#ilac'+ilacIdx+'_etkens .etken-chip');
  var etkenler=[];
  etkenEls.forEach(function(el){etkenler.push(el.dataset.v||el.textContent.trim());});
  var etken=etkenler.join(', ');

}

function depoIlacSec(ilacIdx, barkod){
  var depo=ilacDepoAl();

  if(!d)return;
  // Barkod alanı
  var bEl=document.getElementById('ibk'+ilacIdx);
  if(bEl)bEl.value=barkod;
  // Ticari isim
  var tEl=document.getElementById('ilt'+ilacIdx);
  if(tEl)tEl.value=d.ticari||'';
  // Etken madde
  if(d.etken){
    var etkenler=d.etken.split(',');
    for(var ei=0;ei<etkenler.length;ei++){
      var eVal=etkenler[ei].trim();
      if(!eVal)continue;
      if(!document.getElementById('ile'+ilacIdx+'_'+ei))etkenEkle(ilacIdx);
      var eEl=document.getElementById('ile'+ilacIdx+'_'+ei);
      if(eEl)eEl.value=eVal;
    }
  }
  // Doz
  if(d.doz){
    var dozEl=document.getElementById('ild'+ilacIdx);
    if(dozEl&&!dozEl.value)dozEl.value=d.doz;
  }
  CM();
  toast((d.ticari||barkod)+' secildi!');
}

function getToplam(x){
  // Tane (adet) tipi — sebze/yesillik icin
  if(x.girisTipi==='tane'){
    var tn=+x.tane||0;
    var tf=+x.taneFiyat||0;
    return {pk:0,ak:0,tn:tn,gel:tn*tf};
  }
  var pk=x.piyasaTotalKg||((x.piyasaKasa||0)*(x.piyasaKasaKg||0));
  var ak=x.aromaTotalKg||((x.aromaKasa||0)*(x.aromaKasaKg||0));
  // Dara flag varsa düş
  if(x.piyasaDarali&&(x.piyasaKasa||0)>0) pk=pk-((x.piyasaKasa||0)*KASA_DARA);
  if(x.aromaDarali&&(x.aromaKasa||0)>0) ak=ak-((x.aromaKasa||0)*AROMA_DARA);
  if(pk<0)pk=0; if(ak<0)ak=0;
  return {pk:pk,ak:ak,tn:0,gel:pk*(x.piyasaFiyat||0)+ak*(x.aromaFiyat||0)};
}

    h.forEach(function(x){var ay=(x.tarih||'').substring(0,7);if(!ay)return;if(!aylik[ay])aylik[ay]={gel:0,gid:0,kg:0};var t=getToplam(x);aylik[ay].gel+=t.gel;aylik[ay].kg+=t.pk+t.ak;});
    g.forEach(function(x){var ay=(x.tarih||'').substring(0,7);if(!ay)return;if(!aylik[ay])aylik[ay]={gel:0,gid:0,kg:0};aylik[ay].gid+=Number(x.tutar||0);});
    cavOd.forEach(function(o){var ay=(o.tarih||'').substring(0,7);if(!ay)return;if(!aylik[ay])aylik[ay]={gel:0,gid:0,kg:0};aylik[ay].gid+=Number(o.tutar||0);});
    var aylar=Object.keys(aylik).sort().slice(-12);
    if(aylar.length){
      var maxGel=0;
      aylar.forEach(function(a){if(aylik[a].gel>maxGel)maxGel=aylik[a].gel;});
      html+='<div class="card"><div class="ct">Aylik Kar/Zarar (Son 12 Ay)</div>';
      aylar.forEach(function(ay){
        var d=aylik[ay],k2=d.gel-d.gid;
        var barW=maxGel>0?Math.round(d.gel/maxGel*100):0;
        var ayAd=ay.substring(5)+'/'+ay.substring(0,4);
        html+='<div style="margin-bottom:10px">'+
          '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">'+
          '<span style="font-weight:600">'+ayAd+'</span>'+
          '<span style="color:'+(k2>=0?'#27ae60':'#e74c3c')+'">'+( k2>=0?'+':'')+' TL '+f(k2)+'</span></div>'+
          '<div style="background:#f0f0f0;border-radius:4px;height:8px">'+
          '<div style="background:#27ae60;height:8px;border-radius:4px;width:'+barW+'%"></div></div>'+
          '<div style="font-size:11px;color:#888;margin-top:2px">Gelir: TL '+f(d.gel)+' | Gider: TL '+f(d.gid)+'</div>'+
          '</div>';
      });
      html+='</div>';
    }

    // Tarla bazlı özet
    var tarlaGelir={};
    h.forEach(function(x){var t=tl[x.tarlaIndex];var ad=t?t.ad:'?';if(!tarlaGelir[ad])tarlaGelir[ad]={gel:0,kg:0,n:0};var tot=getToplam(x);tarlaGelir[ad].gel+=tot.gel;tarlaGelir[ad].kg+=tot.pk+tot.ak;tarlaGelir[ad].n++;});
    var tarlaAdlar=Object.keys(tarlaGelir).sort(function(a,b){return tarlaGelir[b].gel-tarlaGelir[a].gel;});
    if(tarlaAdlar.length){
      html+='<div class="card"><div class="ct">Tarla Bazli Performans</div>';
      tarlaAdlar.forEach(function(ad){
        var d=tarlaGelir[ad];
        var tarlaObj=null;
        for(var ti=0;ti<tl.length;ti++){if(tl[ti].ad===ad){tarlaObj=tl[ti];break;}}
        var donum=tarlaObj?tarlaObj.donum:0;
        html+='<div class="li"><div style="flex:1"><div class="mn">'+ad+'</div>'+
          '<div class="sb">'+d.n+' hasat | '+fk(d.kg)+' kg'+(donum?' | '+donum+' donum':'')+'</div>'+
          (donum&&d.kg?'<div style="font-size:11px;color:#8e44ad">Donum basi: '+fk(d.kg/donum)+' kg | TL '+f(d.gel/donum)+'</div>':'')+
          '</div><div class="rt"><div class="at" style="color:#27ae60">TL '+f(d.gel)+'</div>'+
          (d.kg?'<div style="font-size:11px;color:#888">'+fk(d.gel/d.kg)+' TL/kg</div>':'')+
          '</div></div>';
      });
      html+='</div>';
    }
    if(!h.length&&!g.length)html+='<div class="card"><div class="em">Henuz kayit yok.</div></div>';
  }

  // ── HASAT ANALİZİ ──
  else if(bolum===1){
    if(!h.length){html+='<div class="card"><div class="em">Hasat kaydi yok.</div></div>';}
    else{
      // Piyasa vs Aroma oranı
      var topPGel=0,topAGel=0;
      h.forEach(function(x){var t=getToplam(x);topPGel+=t.pk*(x.piyasaFiyat||0);topAGel+=t.ak*(x.aromaFiyat||0);});
      html+='<div class="mg">'+
        '<div class="mc"><div class="l">Piyasa KG</div><div class="v">'+fk(topPiyasaKg)+'</div></div>'+
        '<div class="mc"><div class="l">Aroma KG</div><div class="v">'+fk(topAromaKg)+'</div></div>'+
        '<div class="mc"><div class="l">Piyasa Gelir</div><div class="v" style="color:#27ae60">TL '+f(topPGel)+'</div></div>'+
        '<div class="mc"><div class="l">Aroma Gelir</div><div class="v" style="color:#8e44ad">TL '+f(topAGel)+'</div></div>'+
        '<div class="mc"><div class="l">Ort. Piyasa Fiyat</div><div class="v">'+(topPiyasaKg>0?fk(topPGel/topPiyasaKg)+' TL/kg':'--')+'</div></div>'+
        '<div class="mc"><div class="l">Ort. Aroma Fiyat</div><div class="v">'+(topAromaKg>0?fk(topAGel/topAromaKg)+' TL/kg':'--')+'</div></div>'+
        '</div>';

      // Tarla + meyve türüne göre kırılım
      var meyveGelir={};
      h.forEach(function(x){
        var t=tl[x.tarlaIndex];var ad=t?t.ad:'?';
        var meyve=t?t.meyve:'?';
        var key=meyve||'?';
        if(!meyveGelir[key])meyveGelir[key]={gel:0,kg:0,n:0};
        var tot=getToplam(x);
        meyveGelir[key].gel+=tot.gel;meyveGelir[key].kg+=tot.pk+tot.ak;meyveGelir[key].n++;
      });
      var meyveAdlar=Object.keys(meyveGelir).sort(function(a,b){return meyveGelir[b].gel-meyveGelir[a].gel;});
      if(meyveAdlar.length>1){
        html+='<div class="card"><div class="ct">Meyve Turune Gore</div>';
        meyveAdlar.forEach(function(m){
          var d=meyveGelir[m];
          html+='<div class="li"><div><div class="mn">'+m+'</div><div class="sb">'+d.n+' kayit | '+fk(d.kg)+' kg</div></div>'+
            '<div class="rt"><div class="at" style="color:#27ae60">TL '+f(d.gel)+'</div>'+
            '<div style="font-size:11px;color:#888">'+(d.kg?fk(d.gel/d.kg)+' TL/kg':'')+'</div></div></div>';
        });
        html+='</div>';
      }

      // En iyi ve en kötü hasat
      var sorted=h.slice().sort(function(a,b){return getToplam(b).gel-getToplam(a).gel;});
      html+='<div class="card"><div class="ct">En Yuksek 5 Hasat</div>';
      sorted.slice(0,5).forEach(function(x){
        var t=tl[x.tarlaIndex]||{ad:'?'};var tot=getToplam(x);
        var d=x.tarih?new Date(x.tarih).toLocaleDateString('tr-TR'):'';
        html+='<div class="li"><div><div class="mn">'+t.ad+'</div><div class="sb">'+d+' | '+fk(tot.pk+tot.ak)+' kg</div></div>'+
          '<div class="rt"><div class="at" style="color:#27ae60">TL '+f(tot.gel)+'</div></div></div>';
      });
      html+='</div>';

      // Fiyat trendi
      var fiyatGelisim=h.slice().sort(function(a,b){return (a.tarih||'').localeCompare(b.tarih||'');});
      if(fiyatGelisim.length>=2){
        html+='<div class="card"><div class="ct">Fiyat Trendi (Piyasa TL/kg)</div>';
        fiyatGelisim.forEach(function(x){
          if(!x.piyasaFiyat)return;
          var d=x.tarih?new Date(x.tarih).toLocaleDateString('tr-TR'):'';
          var t=tl[x.tarlaIndex]||{ad:'?'};
          html+='<div class="li"><div><div class="mn">TL '+fk(x.piyasaFiyat)+'/kg</div><div class="sb">'+d+' - '+t.ad+'</div></div></div>';
        });
        html+='</div>';
      }
    }
  }

  // ── GİDER ANALİZİ ──
  else if(bolum===2){
    if(!g.length&&!cavOd.length){html+='<div class="card"><div class="em">Gider kaydi yok.</div></div>';}
    else{
      // Kategori dağılımı
      var gidKat={};
      g.forEach(function(x){var k=x.kategori||'Diger';if(!gidKat[k])gidKat[k]=0;gidKat[k]+=Number(x.tutar||0);});
      if(topCav>0)gidKat['Cavus Odemesi']=(gidKat['Cavus Odemesi']||0)+topCav;
      var katAdlar=Object.keys(gidKat).sort(function(a,b){return gidKat[b]-gidKat[a];});
      var topGidTum2=katAdlar.reduce(function(s,k){return s+gidKat[k];},0);

      html+='<div class="mg">'+
        '<div class="mc"><div class="l">Toplam Gider</div><div class="v" style="color:#e74c3c">TL '+f(topGidTum2)+'</div></div>'+
        '<div class="mc"><div class="l">Gider Kalemi</div><div class="v">'+g.length+'</div></div>'+
        '<div class="mc"><div class="l">Isci Hakedis</div><div class="v" style="color:#e67e22">TL '+f(topIsciHak)+'</div></div>'+
        '<div class="mc"><div class="l">Cavus Odemesi</div><div class="v" style="color:#e67e22">TL '+f(topCav)+'</div></div>'+
        '</div>';

      html+='<div class="card"><div class="ct">Kategori Dagilimi</div>';
      katAdlar.forEach(function(k){
        var v=gidKat[k];
        var pct=topGidTum2>0?Math.round(v/topGidTum2*100):0;
        html+='<div style="margin-bottom:10px">'+
          '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">'+
          '<span style="font-weight:600">'+k+'</span>'+
          '<span style="color:#e74c3c">TL '+f(v)+' (%'+pct+')</span></div>'+
          '<div style="background:#f0f0f0;border-radius:4px;height:8px">'+
          '<div style="background:#e74c3c;height:8px;border-radius:4px;width:'+pct+'%"></div></div></div>';
      });
      html+='</div>';

      // Aylık gider trendi
      var ayGid={};
      g.forEach(function(x){var ay=(x.tarih||'').substring(0,7);if(!ay)return;if(!ayGid[ay])ayGid[ay]={};var k=x.kategori||'Diger';ayGid[ay][k]=(ayGid[ay][k]||0)+Number(x.tutar||0);});
      var ayGidAdlar=Object.keys(ayGid).sort().slice(-6);
      if(ayGidAdlar.length){
        html+='<div class="card"><div class="ct">Aylik Gider (Son 6 Ay)</div>';
        ayGidAdlar.forEach(function(ay){
          var total=Object.keys(ayGid[ay]).reduce(function(s,k){return s+ayGid[ay][k];},0);
          html+='<div class="li"><div><div class="mn">'+ay.substring(5)+'/'+ay.substring(0,4)+'</div>'+
            Object.keys(ayGid[ay]).map(function(k){return '<span style="font-size:11px;color:#888;margin-right:8px">'+k+': TL '+f(ayGid[ay][k])+'</span>';}).join('')+
            '</div><div class="rt"><div class="at" style="color:#e74c3c">TL '+f(total)+'</div></div></div>';
        });
        html+='</div>';
      }

      // En büyük tek giderler
      var buyukGider=g.slice().sort(function(a,b){return Number(b.tutar||0)-Number(a.tutar||0);}).slice(0,5);
      html+='<div class="card"><div class="ct">En Buyuk 5 Gider</div>';
      buyukGider.forEach(function(x){
        var d=x.tarih?new Date(x.tarih).toLocaleDateString('tr-TR'):'';
        html+='<div class="li"><div><div class="mn">'+x.aciklama+'</div><div class="sb">'+d+' | '+x.kategori+'</div></div>'+
          '<div class="rt"><div class="at" style="color:#e74c3c">TL '+f(x.tutar)+'</div></div></div>';
      });
      html+='</div>';
    }
  }

  // ── İŞÇİ ANALİZİ ──
  else if(bolum===3){
    if(!devamlar.length){html+='<div class="card"><div class="em">Isci kaydi yok.</div></div>';}
    else{
      var isciStat={};
      devamlar.forEach(function(d){
        var id=d.isciId||'';if(!id)return;
        if(!isciStat[id])isciStat[id]={gun:0,ucret:0};
        isciStat[id].gun++;isciStat[id].ucret+=Number(d.uygulanenUcret||0);
      });
      var topGun=devamlar.length;
      var topHak=devamlar.reduce(function(s,d){return s+Number(d.uygulanenUcret||0);},0);
      var odenen=cavOd.reduce(function(s,o){return s+Number(o.tutar||0);},0);

      html+='<div class="mg">'+
        '<div class="mc"><div class="l">Toplam Is Gunu</div><div class="v">'+topGun+'</div></div>'+
        '<div class="mc"><div class="l">Isci Sayisi</div><div class="v">'+isciList.length+'</div></div>'+
        '<div class="mc"><div class="l">Toplam Hakedis</div><div class="v" style="color:#2980b9">TL '+f(topHak)+'</div></div>'+
        '<div class="mc"><div class="l">Cavus Odenen</div><div class="v" style="color:#e67e22">TL '+f(odenen)+'</div></div>'+
        '<div class="mc fc"><div class="l">Kalan Borc</div><div class="v" style="color:'+(topHak-odenen>0?'#e74c3c':'#27ae60')+'">TL '+f(Math.abs(topHak-odenen))+'</div></div>'+
        '</div>';

      // Kişi bazlı detay
      html+='<div class="card"><div class="ct">Isci Bazli Performans</div>';
      var isciIds=Object.keys(isciStat).sort(function(a,b){return isciStat[b].gun-isciStat[a].gun;});
      isciIds.forEach(function(id){
        var s=isciStat[id];
        var isc={ad:id};
        for(var ii=0;ii<isciList.length;ii++){if(isciList[ii].id===id){isc=isciList[ii];break;}}
        html+='<div class="li"><div style="flex:1"><div class="mn">'+isc.ad+'</div>'+
          '<div class="sb">'+s.gun+' gun calisti | Ort. TL '+f(s.ucret/s.gun)+'/gun</div></div>'+
          '<div class="rt"><div class="at">TL '+f(s.ucret)+'</div></div></div>';
      });
      html+='</div>';

      // Aylık yoğunluk
      var ayIsci={};
      devamlar.forEach(function(d){
        var ay=(d.tarih||'').substring(0,7);if(!ay)return;
        if(!ayIsci[ay])ayIsci[ay]={gun:0,ucret:0};
        ayIsci[ay].gun++;ayIsci[ay].ucret+=Number(d.uygulanenUcret||0);
      });
      var ayIsciAdlar=Object.keys(ayIsci).sort().slice(-6);
      if(ayIsciAdlar.length){
        html+='<div class="card"><div class="ct">Aylik Is Yuку (Son 6 Ay)</div>';
        ayIsciAdlar.forEach(function(ay){
          var d=ayIsci[ay];
          html+='<div class="li"><div><div class="mn">'+ay.substring(5)+'/'+ay.substring(0,4)+'</div>'+
            '<div class="sb">'+d.gun+' is gunu</div></div>'+
            '<div class="rt"><div class="at">TL '+f(d.ucret)+'</div></div></div>';
        });
        html+='</div>';
      }
    }
  }

  // ── İLAÇ ANALİZİ ──
  else if(bolum===4){
    if(!ilacKayit.length){html+='<div class="card"><div class="em">Ilac kaydi yok.</div></div>';}
    else{
      html+='<div class="mg">'+
        '<div class="mc"><div class="l">Toplam Uygulama</div><div class="v">'+ilacKayit.length+'</div></div>'+
        '<div class="mc"><div class="l">Farkli Tarla</div><div class="v">'+(function(){var s={};ilacKayit.forEach(function(k){if(k.tarla)s[k.tarla]=1;});return Object.keys(s).length;})()+'</div></div>'+
        '</div>';

      // Tarla bazlı ilaç sıklığı
      var tarlaSiklik={};
      ilacKayit.forEach(function(k){var t=k.tarla||'?';if(!tarlaSiklik[t])tarlaSiklik[t]=0;tarlaSiklik[t]++;});
      var tarlaSikAdlar=Object.keys(tarlaSiklik).sort(function(a,b){return tarlaSiklik[b]-tarlaSiklik[a];});
      html+='<div class="card"><div class="ct">Tarla Bazli Ilaclama Sikligi</div>';
      tarlaSikAdlar.forEach(function(t){
        html+='<div class="li"><div class="mn">'+t+'</div><div class="rt"><div class="at">'+tarlaSiklik[t]+' uygulama</div></div></div>';
      });
      html+='</div>';

      // İlaç kullanım sıklığı
      var ilacSiklik={};
      ilacKayit.forEach(function(k){
        (k.ilaclar||[]).forEach(function(il){var ad=il.ad||'';if(ad){if(!ilacSiklik[ad])ilacSiklik[ad]=0;ilacSiklik[ad]++;}});
      });
      var ilacAdlar=Object.keys(ilacSiklik).sort(function(a,b){return ilacSiklik[b]-ilacSiklik[a];}).slice(0,10);
      if(ilacAdlar.length){
        html+='<div class="card"><div class="ct">En Sik Kullanilan Ilaclar (Top 10)</div>';
        ilacAdlar.forEach(function(ad){
          html+='<div class="li"><div class="mn">'+ad+'</div><div class="rt"><div class="at">'+ilacSiklik[ad]+' kez</div></div></div>';
        });
        html+='</div>';
      }



      // Aylık ilaçlama takvimi
      var ayIlac={};
      ilacKayit.forEach(function(k){var ay=(k.tarih||'').substring(0,7);if(!ay)return;if(!ayIlac[ay])ayIlac[ay]=0;ayIlac[ay]++;});
      var ayIlacAdlar=Object.keys(ayIlac).sort();
      if(ayIlacAdlar.length){
        html+='<div class="card"><div class="ct">Aylik Ilaclama Takvimi</div>';
        ayIlacAdlar.forEach(function(ay){
          html+='<div class="li"><div class="mn">'+ay.substring(5)+'/'+ay.substring(0,4)+'</div>'+
            '<div class="rt"><div class="at">'+ayIlac[ay]+' uygulama</div></div></div>';
        });
        html+='</div>';
      }
    }
  }

  // ── GÜBRE ANALİZİ ──
  else if(bolum===5){
    var gubreKayit=(V.gubre&&V.gubre.kayitlar)||[];
    if(!gubreKayit.length){html+='<div class="card"><div class="em">Gubre kaydi yok.</div></div>';}
    else{
      // Toplam istatistikler
      var topToplamKg=0,topDonum=0;
      var tarlaSay={};
      gubreKayit.forEach(function(k){
        topToplamKg+=Number(k.toplamMiktar||0);
        var t=null;if(V.tarlalar){for(var _ti=0;_ti<V.tarlalar.length;_ti++){if(V.tarlalar[_ti].ad===k.tarla){t=V.tarlalar[_ti];break;}}}
        var dn=t?parseFloat(t.donum)||0:0;
        if(!tarlaSay[k.tarla||'?'])tarlaSay[k.tarla||'?']={n:0,toplamKg:0,donum:dn,gubreler:{}};
        tarlaSay[k.tarla||'?'].n++;
        tarlaSay[k.tarla||'?'].toplamKg+=Number(k.toplamMiktar||0);
        var gad=k.gubreAdi||'?';
        if(!tarlaSay[k.tarla||'?'].gubreler[gad])tarlaSay[k.tarla||'?'].gubreler[gad]=0;
        tarlaSay[k.tarla||'?'].gubreler[gad]+=Number(k.toplamMiktar||0);
      });
      var uygSay=gubreKayit.length;
      var farkliTarla=Object.keys(tarlaSay).length;
      var gubreSay={};
      gubreKayit.forEach(function(k){var g=k.gubreAdi||'?';if(!gubreSay[g])gubreSay[g]={n:0,kg:0};gubreSay[g].n++;gubreSay[g].kg+=Number(k.toplamMiktar||0);});

      html+='<div class="mg">'+
        '<div class="mc"><div class="l">Toplam Uygulama</div><div class="v">'+uygSay+'</div></div>'+
        '<div class="mc"><div class="l">Farkli Tarla</div><div class="v">'+farkliTarla+'</div></div>'+
        '<div class="mc fc"><div class="l">Toplam Gubre (kg)</div><div class="v" style="color:#27ae60">'+topToplamKg.toFixed(1)+' kg</div></div>'+
        '</div>';

      // Tarla bazlı gübre özeti
      html+='<div class="card"><div class="ct">Tarla Bazli Gubre Ozeti</div>';
      Object.keys(tarlaSay).sort().forEach(function(tarla){
        var d=tarlaSay[tarla];
        var dn=d.donum;
        var gubreList=Object.keys(d.gubreler).map(function(g){return g+': '+d.gubreler[g].toFixed(1)+'kg';}).join(', ');
        html+='<div class="li"><div style="flex:1"><div class="mn">'+tarla+'</div>'+
          '<div class="sb">'+d.n+' uygulama | Toplam: '+d.toplamKg.toFixed(1)+' kg</div>'+
          (dn>0?'<div style="font-size:11px;color:#8e44ad">Donum basi: '+(d.toplamKg/dn).toFixed(1)+' kg/donum</div>':'')+
          '<div style="font-size:11px;color:#888">'+gubreList+'</div>'+
          '</div></div>';
      });
      html+='</div>';

      // Gübre türü bazlı kullanım
      var gubreAdlar=Object.keys(gubreSay).sort(function(a,b){return gubreSay[b].kg-gubreSay[a].kg;});
      html+='<div class="card"><div class="ct">Gubre Turu Bazli Kullanim</div>';
      gubreAdlar.forEach(function(g){
        var d=gubreSay[g];
        html+='<div class="li"><div><div class="mn">'+g+'</div><div class="sb">'+d.n+' uygulama</div></div>'+
          '<div class="rt"><div class="at" style="color:#27ae60">'+d.kg.toFixed(1)+' kg</div></div></div>';
      });
      html+='</div>';

      // Aylık gübre takvimi
      var ayGubre={};
      gubreKayit.forEach(function(k){var ay=(k.tarih||'').substring(0,7);if(!ay)return;if(!ayGubre[ay])ayGubre[ay]=0;ayGubre[ay]+=Number(k.toplamMiktar||0);});
      var ayGubreAdlar=Object.keys(ayGubre).sort();
      if(ayGubreAdlar.length){
        html+='<div class="card"><div class="ct">Aylik Gubre Kullanimi</div>';
        ayGubreAdlar.forEach(function(ay){
          html+='<div class="li"><div class="mn">'+ay.substring(5)+'/'+ay.substring(0,4)+'</div>'+
            '<div class="rt"><div class="at">'+ayGubre[ay].toFixed(1)+' kg</div></div></div>';
        });
        html+='</div>';
      }
    }
  }

// Eşleştirme tablosu - localStorage
function _ilacEslestirmeKaydet(ticari, etken){
  if(!ticari||!etken)return;
  try{
    var tbl=JSON.parse(localStorage.getItem('ilacEslestirme')||'{}');
    tbl[ticari.trim()]=etken.trim();
    localStorage.setItem('ilacEslestirme',JSON.stringify(tbl));
  }catch(e){}
}

function _etkenBul(ticari){
  if(!ticari)return '';
  try{
    var tbl=JSON.parse(localStorage.getItem('ilacEslestirme')||'{}');
    return tbl[ticari.trim()]||'';
  }catch(e){return '';}
}

function _ticariOneri(etken){
  try{
    var tbl=JSON.parse(localStorage.getItem('ilacEslestirme')||'{}');
    return Object.keys(tbl).filter(function(k){
      return !etken||tbl[k].toLowerCase().indexOf(etken.toLowerCase())>=0;
    }).map(function(k){return '<option value="'+k+'">';}).join('');
  }catch(e){return '';}
}

function _etkenOneri(ticari){
  try{
    var tbl=JSON.parse(localStorage.getItem('ilacEslestirme')||'{}');
    if(ticari&&tbl[ticari.trim()]){
      return '<option value="'+tbl[ticari.trim()]+'">';
    }
    // Tüm etken maddeleri öner
    var eskiler=Object.values(tbl);
    return eskiler.map(function(e){return '<option value="'+e+'">';}).join('');
  }catch(e){return '';}
}

function iGuncelleSonuc(){
  var donum=iGetDonum();

  var sonucDiv=document.getElementById('i_sonuc');
  if(!sonucDiv)return;

  // Toplam su hesapla
  var gercekTopSu=topSu||(donumSu>0&&donum>0?donumSu*donum:0);

  // Toplam ilaç miktarı hesapla
  // d100: ml/100lt su → toplamIlac = gercekTopSu/100 * d100 (ml)
  // dton: ml/ton → toplamIlac = gercekTopSu * dton / 1000 (ml)
  var toplamMl=0;
  if(d100>0&&gercekTopSu>0) toplamMl=gercekTopSu/100*d100;
  else if(dton>0&&gercekTopSu>0) toplamMl=gercekTopSu*dton/1000;

  var satirlar=[];
  if(donumSu>0)satirlar.push(donumSu.toFixed(0)+' lt/donum');
  if(gercekTopSu>0)satirlar.push(gercekTopSu.toFixed(0)+' lt toplam su');
  if(d100>0)satirlar.push(d100.toFixed(1)+' ml/100lt');
  if(dton>0)satirlar.push(dton.toFixed(1)+' ml/ton');

  // Toplam ilaç göster
  if(toplamMl>0){
    // Birim dönüşümü
  var birimEl=document.getElementById('i_d100birim');
  var birim=birimEl?birimEl.value:'ml';
  var toplamGr=birim==='kg'?toplamMl*1000:toplamMl; // kg→gr, ml ve gr aynı
    var goster='';
    if(toplamGr>=1000) goster=(toplamGr/1000).toFixed(2)+' kg';
    else goster=toplamGr.toFixed(0)+' ml (gr)';
    satirlar.push('→ TOPLAM ILAC: '+goster);
    sonucDiv.style.background='#1e8449';
  } else {
    sonucDiv.style.background='#27ae60';
  }

  sonucDiv.textContent=satirlar.length?satirlar.join(' | '):'';
}

function etiketPollBaslat(idx){
  if(window._aktifPollTimer)clearInterval(window._aktifPollTimer);
  var pollCount=0;
  var dr=document.getElementById('ildr'+idx);
  window._aktifPollTimer=setInterval(function(){
    pollCount++;
    if(pollCount>60){clearInterval(window._aktifPollTimer);if(dr)dr.textContent='Zaman asimi';return;}
    if(dr)dr.textContent='Isleniyor '+pollCount+'...';
    try{
      if(!window.Android||!Android.etiketSonucAl)return;
      var sonuc=Android.etiketSonucAl();
      if(sonuc&&sonuc.length>0){
        clearInterval(window._aktifPollTimer);
        var parts=sonuc.split('||');
        var sonucIdx=parseInt(parts[0]);
        var sonucMetin=parts.slice(1).join('||');
        if(sonucMetin.indexOf('HATA:')==0){
          etiketHata(sonucMetin.substring(5));
        } else {
          etiketSonuc(sonucIdx,sonucMetin);
        }
      }
    }catch(pe){}
  },1000);

function etkDuzenle(i){
  var cb=document.getElementById('etk_'+i);
  var txt=document.getElementById('etk_txt_'+i);
  if(!cb||!txt)return;
  var mevcutDeger=cb.value;
  var yeniDeger=txt.textContent;
  // Inline düzenleme
  txt.contentEditable='true';
  txt.style.background='#fff';
  txt.style.outline='2px solid #27ae60';
  txt.style.borderRadius='4px';
  txt.style.padding='2px 6px';
  txt.focus();
  // Seçimi sona al
  var r=document.createRange();
  r.selectNodeContents(txt);
  r.collapse(false);
  window.getSelection().removeAllRanges();
  window.getSelection().addRange(r);
  // Enter ile kaydet
  txt.onkeydown=function(e){
    if(e.key==='Enter'){
      e.preventDefault();
      var yeni=txt.textContent.trim();
      if(yeni){cb.value=yeni;}
      txt.contentEditable='false';
      txt.style.background='';
      txt.style.outline='';
      txt.style.padding='';
    } else if(e.key==='Escape'){
      txt.textContent=mevcutDeger;
      txt.contentEditable='false';
      txt.style.background='';
      txt.style.outline='';
      txt.style.padding='';
    }
  };
  txt.onblur=function(){
    var yeni=txt.textContent.trim();
    if(yeni){cb.value=yeni;}
    txt.contentEditable='false';
    txt.style.background='';
    txt.style.outline='';
    txt.style.padding='';
  };
}
function etiketSecimiKaydet(idx){

  CM2();

  // Secilenleri ILACLAR listesine ekle (bir daha kullanilabilsin)
  secili.forEach(function(s){
    var temizS=s.trim();
    if(!temizS)return;
    if(ILACLAR.indexOf(temizS)<0){
      ILACLAR.push(temizS);
      ILACLAR.sort();
      if(!V.ozelIlaclar)V.ozelIlaclar=[];
      if(V.ozelIlaclar.indexOf(temizS)<0){
        V.ozelIlaclar.push(temizS);
        if(window.Android)Android.saveData(JSON.stringify(V));
      }
    }
  });
  // Alana yaz - kullanici kaydet butonuna basar
  if(el){
    el.value=secili[0];
    el.readOnly=false;
    el.focus();
    // İmleci sona al
    var len=el.value.length;
    el.setSelectionRange(len,len);
  }
  for(var si=1;si<secili.length;si++){
    ilacEkle();
    var yeni=document.getElementById('il'+(_ilacN-1));
    if(yeni){
      yeni.value=secili[si];
      yeni.readOnly=false;
    }
  }

function kI(){

    var e0=document.getElementById('ile'+i+'_0');

      var etkens=[];
      for(var ei=0;ei<20;ei++){
        var eEl=document.getElementById('ile'+i+'_'+ei);
        if(!eEl)break;
        var ev=eEl.value.trim();
        if(ev)etkens.push(ev);
      }
      if(!etkens.length&&e.value.trim())etkens=[e.value.trim()];
      // Ana ad: ilk etken, yoksa ticari ad (etken madde artik zorunlu degil)
      var mainAd=etkens[0]||e.value.trim()||ticAd;
      if(ticAd&&mainAd)_ilacEslestirmeKaydet(ticAd,etkens.join(', '));
      var barkodEl2=document.getElementById('ibk'+i);
      var barkodNo=barkodEl2?barkodEl2.value.trim():'';
      // Barkod deposuna kaydet
      if(barkodNo&&(ticAd||etkens.length)){
        ilacBarkodKaydetDepo(barkodNo, ticAd, etkens.join(', '), String(doz2||''));
      }
      il.push({ad:mainAd,ticari:ticAd,etkens:etkens,doz100:doz2,foto:ilFoto,barkod:barkodNo});
    }
  }
  window._ilacFotolar={};
  if(!il.length)il=[{ad:'',doz100:0}];
  var seciliTarlalar=iTarlaSeciliListesi();
  if(!seciliTarlalar.length){toast('En az bir tarla secin!');return;}
  var topSu=parseFloat(gv('i_topsu'))||0;
  var donSu=parseFloat(gv('i_donumsu'))||0;
  var d100=parseFloat(gv('i_d100'))||0;
  var dton=parseFloat(gv('i_dton'))||0;
  var _mevcutFoto=EI>=0?((V.ilac&&V.ilac.kayitlar||[])[EI]||{}).foto||'':'';
  if(!V.ilac)V.ilac={kayitlar:[]};
  if(!V.ilac.kayitlar)V.ilac.kayitlar=[];
  // Her tarla için ayrı kayıt oluştur
  if(EI>=0){
    if(window._editGrupId&&window._editGrupIndeksler&&window._editGrupIndeksler.length>1){
      var _tarih2=gv('i0'),_not2=gv('i4');
      // Toplam dönüm hesapla
      var _topDonum2=0;
      window._editGrupIndeksler.forEach(function(idx){
        var mk=V.ilac.kayitlar[idx]; if(!mk)return;
        var tObj=null;var _tl=V.tarlalar||[];
        for(var i=0;i<_tl.length;i++){if(_tl[i].ad===(mk.tarla||'')){tObj=_tl[i];break;}}
        _topDonum2+=tObj?parseFloat(tObj.donum)||0:0;
      });
      window._editGrupIndeksler.forEach(function(idx){
        var mk=V.ilac.kayitlar[idx]; if(!mk)return;
        var tObj=null;var _tl=V.tarlalar||[];
        for(var i=0;i<_tl.length;i++){if(_tl[i].ad===(mk.tarla||'')){tObj=_tl[i];break;}}
        var _dn=tObj?parseFloat(tObj.donum)||0:0;
        var _suTarla=topSu;
        if(donSu>0&&_dn>0){
          _suTarla=donSu*_dn;
        } else if(topSu>0&&_topDonum2>0&&_dn>0){
          _suTarla=Math.round(topSu*_dn/_topDonum2*10)/10;
        }
        mk.tarih=_tarih2; mk.ilaclar=il; mk.not=_not2;
        mk.su=_suTarla; mk.suGirilen=topSu; mk.donumSu=donSu; mk.doz100=d100; mk.dozTon=dton;
      });
      window._editGrupId=null; window._editGrupIndeksler=null;
    } else {

      V.ilac.kayitlar[EI]=k;
    }
  } else {
    // Yeni kayıt - seçilen her tarla için ayrı kayıt
    var gid=uid();

    seciliTarlalar.forEach(function(tarlaAd){

    });
    seciliTarlalar.forEach(function(tarlaAd){
      var tarlaObj=null;
      (V.tarlalar||[]).forEach(function(t){if(t.ad===tarlaAd)tarlaObj=t;});
      var dn=tarlaObj?parseFloat(tarlaObj.donum)||0:0;
      // topSu = kullanıcının girdiği TOPLAM su

      var topSuTarla=0;
      if(donSu>0&&dn>0){
        topSuTarla=donSu*dn; // dönüm başı girilmişse
      } else if(topSu>0&&topTumDonum>0&&dn>0){
        topSuTarla=Math.round(topSu*dn/topTumDonum*10)/10; // toplam girilmişse dönüme böl
      } else {
        topSuTarla=topSu;
      }
      var k={id:uid(),groupId:gid,tarih:gv('i0'),tarlalar:[tarlaAd],tarla:tarlaAd,meyveTuru:tarlaObj?tarlaObj.meyve||'':'',ilaclar:il,not:gv('i4'),su:topSuTarla,suGirilen:topSu,donumSu:donSu,doz100:d100,dozTon:dton,foto:window._ilacFoto||_mevcutFoto};
      V.ilac.kayitlar.push(k);
    });
  }
  sv();CM();R();

function gbTarlaSecimiMeyve(meyve){
  var checkboxlar=document.querySelectorAll('#gbTarlaDiv input[type=checkbox]');
  var tarlaMeyveler={};
  (V.tarlalar||[]).forEach(function(t){tarlaMeyveler[t.ad]=t.meyve||'';});
  var hepsiSecili=true;
  for(var _ci=0;_ci<checkboxlar.length;_ci++){
    if(tarlaMeyveler[checkboxlar[_ci].value]===meyve&&!checkboxlar[_ci].checked){hepsiSecili=false;break;}
  }
  for(var _ci2=0;_ci2<checkboxlar.length;_ci2++){
    if(tarlaMeyveler[checkboxlar[_ci2].value]===meyve){
      checkboxlar[_ci2].checked=!hepsiSecili;
      checkboxlar[_ci2].parentElement.style.background=(!hepsiSecili?'#e8f8f0':'#f8f8f8');
    }
  }
  var dm=parseFloat((document.getElementById('gb_donum')||{}).value)||0;
  var tm=parseFloat((document.getElementById('gb_toplam')||{}).value)||0;
  if(dm>0)gbHesapla('donum');else if(tm>0)gbHesapla('toplam');
}
function gbHesapla(tip){
  var seciliTarlalar=gbSeciliTarlalar();
  if(!seciliTarlalar.length){var cbx=document.querySelectorAll('#gbTarlaDiv input[type=checkbox]');for(var _c0=0;_c0<cbx.length;_c0++){seciliTarlalar.push(cbx[_c0].value);}}
  var toplamDonum=0;
  seciliTarlalar.forEach(function(ta){
    var _tl=V.tarlalar||[];
    for(var _i=0;_i<_tl.length;_i++){if(_tl[_i].ad===ta){toplamDonum+=parseFloat(_tl[_i].donum)||0;break;}}
  });
  if(toplamDonum<=0)return;
  if(tip==='donum'){
    var dm=parseFloat((document.getElementById('gb_donum')||{}).value)||0;
    if(dm>0){
      var el=document.getElementById('gb_toplam');
      if(el)el.value=(dm*toplamDonum).toFixed(1);
    }
  } else {
    var tm=parseFloat((document.getElementById('gb_toplam')||{}).value)||0;
    if(tm>0){
      var el=document.getElementById('gb_donum');
      if(el)el.value=(tm/toplamDonum).toFixed(1);
    }
  }
}
function gbHD(){gbHesapla('donum');}
function gbHT(){gbHesapla('toplam');}

function kGB(){
  var tarih=gv('gb_tarih');var tarlalar=gbSeciliTarlalar();var tarla=tarlalar[0]||'';var gubre=gv('gb_gubre');
  if(gubre==='__diger__'){
    var _ozel=(document.getElementById('gb_gubreOzel')||{}).value||'';
    if(_ozel.trim()){
      gubre=_ozel.trim();
      var _og2=JSON.parse(localStorage.getItem('ozelGubreler')||'[]');
      if(_og2.indexOf(gubre)<0){_og2.push(gubre);localStorage.setItem('ozelGubreler',JSON.stringify(_og2));}
      if(GUBRELER.indexOf(gubre)<0)GUBRELER.splice(GUBRELER.indexOf('__diger__'),0,gubre);
    }
  }
  var donum=parseFloat(gv('gb_donum'))||0;var toplam=parseFloat(gv('gb_toplam'))||0;
  var not=gv('gb_not');
  if(!tarlalar.length){toast('En az bir tarla secin!');return;}
  if(!gubre){toast('Gübre secin!');return;}
  if(!donum&&!toplam){toast('Miktar girin!');return;}
  var toplamDonumKG=0;
  tarlalar.forEach(function(ta){var _tl=V.tarlalar||[];for(var _i=0;_i<_tl.length;_i++){if(_tl[_i].ad===ta){toplamDonumKG+=parseFloat(_tl[_i].donum)||0;break;}}});
  if(toplamDonumKG>0){
    if(donum&&!toplam)toplam=parseFloat((donum*toplamDonumKG).toFixed(1));
    else if(toplam&&!donum)donum=parseFloat((toplam/toplamDonumKG).toFixed(1));
  }
  if(!V.gubre)V.gubre={kayitlar:[]};
  if(!V.gubre.kayitlar)V.gubre.kayitlar=[];
  if(EI>=0){
    // Düzenleme - tek kayıt
    var kayit={tarih:tarih,tarla:tarla,tarlalar:tarlalar,gubreAdi:gubre,donumMiktar:donum,toplamMiktar:toplam,not:not};
    V.gubre.kayitlar[EI]=kayit;
  } else if(tarlalar.length>1){
    // Toplu - groupId ile birleştir
    var gid=uid();
    var toplamDonum=0;
    tarlalar.forEach(function(ta){var _tl=V.tarlalar||[];for(var _i=0;_i<_tl.length;_i++){if(_tl[_i].ad===ta){toplamDonum+=parseFloat(_tl[_i].donum)||0;break;}}});
    tarlalar.forEach(function(ta){
      var t=null;var _tl2=V.tarlalar||[];for(var _i2=0;_i2<_tl2.length;_i2++){if(_tl2[_i2].ad===ta){t=_tl2[_i2];break;}}
      var dn=t?parseFloat(t.donum)||0:0;
      var tarlaToplam=toplam;
      if(toplam>0&&toplamDonum>0&&dn>0) tarlaToplam=parseFloat((toplam*dn/toplamDonum).toFixed(1));
      if(donum>0&&dn>0) tarlaToplam=parseFloat((donum*dn).toFixed(1));
      V.gubre.kayitlar.push({
        groupId:gid,tarih:tarih,tarla:ta,tarlalar:tarlalar,
        gubreAdi:gubre,donumMiktar:donum,toplamMiktar:tarlaToplam,not:not
      });
    });
  } else {
    var kayit={tarih:tarih,tarla:tarla,tarlalar:tarlalar,gubreAdi:gubre,donumMiktar:donum,toplamMiktar:toplam,not:not};

  }
  sv();CM();R();
}

function resimKucult(dataUri, cb){
  // Fotoğrafı max 600px genişliğe ve %70 kaliteye küçült
  try{
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var maxW=600;
      var ratio=Math.min(1, maxW/img.width);
      canvas.width=img.width*ratio;
      canvas.height=img.height*ratio;
      var ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL('image/jpeg',0.7));
    };
    img.src=dataUri;
  }catch(e){cb(dataUri);}
}

function fotoSec(cb){
  _fotoCB=cb;
  // Her platformda file input kullan (Android dahil)
  var inp=document.getElementById('_fotoInput');
  if(!inp){
    inp=document.createElement('input');
    inp.type='file';
    inp.id='_fotoInput';
    inp.accept='image/*';
    // capture kaldırıldı - kullanıcı hem galeri hem kamera seçebilir
    inp.style.cssText='position:fixed;top:-1000px;left:-1000px;opacity:0;width:1px;height:1px';
    inp.onchange=function(){
      if(!this.files||!this.files[0])return;
      var reader=new FileReader();
      reader.onload=function(e){
        if(typeof _fotoCB==='function') _fotoCB(e.target.result);
      };
      reader.readAsDataURL(this.files[0]);
    };
    document.body.appendChild(inp);
  }
  inp.value='';
  // Android WebView'da click() çalışmayabilir - touch event simüle et
  setTimeout(function(){inp.click();},50);
}
function kameraSec(cb){
  _fotoCB=cb;
  // Kotlin ile kamera aç - OCR callback
  if(window.Android&&Android.kameraAc){
    Android.kameraAc('_kameraOcrSonuc');
    return;
  }
  // Fallback: file input
  var inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.setAttribute('capture','environment');
  inp.style.cssText='position:fixed;top:-9999px';
  inp.onchange=function(){
    if(!this.files||!this.files[0])return;
    var reader=new FileReader();
    reader.onload=function(e){if(typeof _fotoCB==='function')_fotoCB(e.target.result);_fotoCB=null;};
    reader.readAsDataURL(this.files[0]);
  };
  document.body.appendChild(inp);
  setTimeout(function(){inp.click();},50);
}
function _kameraOcrSonuc(d){
  // Kotlin'den OCR sonucu geldi
  if(typeof d==='string')try{d=JSON.parse(d);}catch(e){}
  if(d&&d.status==='ok'&&d.text){
    var idx=window._ocrIlacIdx||0;
    var dr=document.getElementById('ildr'+idx);
    if(dr)dr.textContent='';
    var text=d.text.trim();
    var tEl=document.getElementById('ilt'+idx);
    if(tEl&&!tEl.value){
      var ilkSatir=text.split('\n')[0].trim();
      tEl.value=ilkSatir;
      ilacTicariDegisti(idx);
      toast('Okundu: '+ilkSatir.substring(0,30));
    } else {
      _ocrSonuc(d);
    }
  } else {
    toast('Metin okunamadi');
  }
}

function _driveSyncGoster(durum,mesaj){
  var kart=document.getElementById('driveDurumKart');
  var metin=document.getElementById('driveDurumMetin');
  var zaman=document.getElementById('driveDurumZaman');
  var renk,kartBg,ikon;
  if(durum==='ok'){ikon='✓';renk='#27ae60';kartBg='#e8f5e9';}
  else if(durum==='hata'){ikon='✗';renk='#e74c3c';kartBg='#fdecea';}
  else if(durum==='bekle'){ikon='…';renk='#e67e22';kartBg='#fff8e1';}
  else{ikon='●';renk='#aaa';kartBg='#f5f5f5';}
  var now=new Date();
  var saat=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  if(kart)kart.style.background=kartBg;
  if(metin){metin.style.color=renk;metin.textContent=ikon+' '+(mesaj||'Bilinmiyor');}
  if(zaman&&durum!=='bekle')zaman.textContent='Son: '+saat;
}
function _driveKaydetSonuc(txt){
  try{
    if(typeof txt==='object'&&txt!==null){
      if(txt.status==='ok'){_driveSyncGoster('ok','Kaydedildi');toast('Drive\'a kaydedildi!');}
      else{_driveSyncGoster('hata','Hata');toast('Drive hatasi: '+(txt.message||'?'));}
      return;
    }
    if(typeof txt==='string'){
      // URL encoded gelmiş olabilir
      try{txt=decodeURIComponent(txt);}catch(e){}
      // data= prefix varsa temizle
      if(txt.indexOf('data=')===0)txt=txt.substring(5);
      var d=JSON.parse(txt);
      if(d.status==='ok'){_driveSyncGoster('ok','Kaydedildi');toast('Drive\'a kaydedildi!');}
      else{_driveSyncGoster('hata','Hata');toast('Drive hatasi: '+(d.message||'?'));}
    }
  }catch(e){
    // Parse edilemeyen yanıt - sessizce geç, oto kayıt için toast gösterme
    if(OTOKAYT_DRIVE){_driveSyncGoster('ok','Gonderildi');}
    else{_driveSyncGoster('hata','Hata');toast('Drive yanit hatasi');}
  }
}
function _driveGetirSonuc(txt){
  if(typeof txt==='string')try{txt=JSON.parse(txt);}catch(e){}
  try{
    if(txt&&txt.status==='ok'&&txt.data){
      V=txt.data;
      try{ V = JSON.parse(JSON.stringify(V).replace(/\+/g,' ')); }catch(e){}
      if(V.bulutAyar){BIN_KEY=V.bulutAyar.apiKey||BIN_KEY;BIN_ID=V.bulutAyar.binId||BIN_ID;DRIVE_URL=V.bulutAyar.driveUrl||DRIVE_URL;OTOKAYT_API=V.bulutAyar.otoKaytApi===true;OTOKAYT_DRIVE=V.bulutAyar.otoDrive===true;}
      if(window.Android)Android.saveData(JSON.stringify(V));
      try{localStorage.setItem('ciftci_veri',JSON.stringify(V));}catch(e){}
      _driveSyncGoster('ok','Yuklendi');toast('Drive\'dan yuklendi!');R();
    } else if(txt&&txt.status==='empty'){
      _driveSyncGoster('hata','Dosya Yok');toast('Drive\'da kayitli veri bulunamadi.');
    } else {
      _driveSyncGoster('hata','Hata');toast('Drive hatasi: '+((txt&&txt.message)||'?'));
    }
  }catch(e){_driveSyncGoster('hata','Hata');toast('Drive yanit hatasi: '+String(e));}
}

function _fotoSizKopyala(obj){
  // Fotoğraf verilerini çıkararak derin kopya al (bulut için)
  var str=JSON.stringify(obj);
  var parsed=JSON.parse(str);
  try{
    if(parsed.arsiv){
      Object.keys(parsed.arsiv).forEach(function(yil){
        var v=parsed.arsiv[yil];
        if(v.hasatKayitlari)v.hasatKayitlari.forEach(function(h){delete h.foto;});
        if(v.ilac&&v.ilac.kayitlar)v.ilac.kayitlar.forEach(function(k){delete k.foto;});
      });
    }
    if(parsed.hasatKayitlari)parsed.hasatKayitlari.forEach(function(h){delete h.foto;});
    if(parsed.ilac&&parsed.ilac.kayitlar)parsed.ilac.kayitlar.forEach(function(k){delete k.foto;});
  }catch(e){}
  return parsed;
}
function _bulutPUT(binId,veri,sonCb){
  // Mevcut bin'den admin bilgilerini koru, sonra üzerine yaz
  fetch('https://api.jsonbin.io/v3/b/'+binId+'/latest',{headers:{'X-Master-Key':BIN_KEY}})
    .then(function(r){return r.json();})
    .then(function(mevcut){
      var yeni=_fotoSizKopyala(veri); // fotoğraflar olmadan gönder
      if(mevcut.record){
        if(mevcut.record.kullanicilar)yeni.kullanicilar=mevcut.record.kullanicilar;
        if(mevcut.record.adminSifre)yeni.adminSifre=mevcut.record.adminSifre;
        if(mevcut.record.adminAd)yeni.adminAd=mevcut.record.adminAd;
      }
      return fetch('https://api.jsonbin.io/v3/b/'+binId,{method:'PUT',
        headers:{'Content-Type':'application/json','X-Master-Key':BIN_KEY},
        body:JSON.stringify(yeni)});
    }).then(function(r){return r.json();})
    .then(function(d){if(sonCb)sonCb(d.metadata?true:false,d.message||'');})
    .catch(function(){if(sonCb)sonCb(false,'Baglanti hatasi');});
}

function ilacListeGoster(ara){

  if(!liste)return;
  ara=(ara||'').toLowerCase().trim();
  // Dinamik liste: standart + ozelIlaclar (silinmişler dahil değil)
  var tumListe=ILACLAR.slice();
  (V.ozelIlaclar||[]).forEach(function(x){if(tumListe.indexOf(x)<0)tumListe.push(x);});
  tumListe.sort();
  var sonuc=ara?tumListe.filter(function(x){return x.toLowerCase().indexOf(ara)>=0;}):tumListe;
  var html='';
  // Listede yoksa "Ekle" butonu göster
  if(ara && !ILACLAR.filter(function(x){return x.toLowerCase()===ara;}).length){
    var araGoster=document.getElementById('ilacAra')?document.getElementById('ilacAra').value.trim():'';

function ozelIlacSil(x){
  if(!V.ozelIlaclar)return;

  if(idx>=0){
    V.ozelIlaclar.splice(idx,1);

    var liIdx=ILACLAR.indexOf(x);
    if(liIdx>=0)ILACLAR.splice(liIdx,1);

function ilacYeniEkle(){
  var araInp=document.getElementById('ilacAra');
  if(!araInp)return;
  var yeni=araInp.value.trim();
  if(!yeni)return;
  // Listeye kalıcı ekle
  if((V.ozelIlaclar||[]).indexOf(yeni)<0&&ILACLAR.indexOf(yeni)<0){
    // Standart listede yoksa ozel listeye ekle
    ILACLAR.push(yeni);
    ILACLAR.sort();
    // Özel listeyi kaydet
    if(!V.ozelIlaclar)V.ozelIlaclar=[];
    if(V.ozelIlaclar.indexOf(yeni)<0){V.ozelIlaclar.push(yeni);if(window.Android)Android.saveData(JSON.stringify(V));}
  }
  ilacSec(yeni);
}
function ilacSec(ad){
  if(!V.ozelIlaclar)V.ozelIlaclar=[];

  for(var ei=0;ei<20;ei++){

    if(!el.value.trim()){el.value=ad;yazildi=true;break;}
  }
  // Hepsi doluysa yeni ekle
  if(!yazildi){
    etkenEkle(i);

      for(var ei=0;ei<20;ei++){
        var el=document.getElementById('ile'+i+'_'+ei);
        if(el&&!el.value.trim()){el.value=ad;break;}
      }
    },50);
  }
  CM2();
}





function excelAktar(tip){
  if(typeof XLSX==='undefined'){toast('Excel kutuphanesi yuklenemedi');return;}
  var wb=XLSX.utils.book_new();
  var tarih=new Date().toLocaleDateString('tr-TR').replace(/\./g,'-');
  var tl=V.tarlalar||[];

  function tarlaAd(idx){var t=tl[idx];return t?t.ad:('Tarla '+(idx+1));}

  if(tip==='hasat'||tip==='tamami'){
    var rows=(V.hasatKayitlari||[]).map(function(h){
      var tot=getToplam(h);
      var tip2=h.girisTipi==='tane'?'Tane':(h.girisTipi==='kg'?'KG':'Kasa');
      return {
        'Tarih':h.tarih||'',
        'Tarla':tarlaAd(h.tarlaIndex),
        'Tip':tip2,
        'Tane':h.girisTipi==='tane'?(h.tane||0):'',
        'Tane Fiyat TL':h.girisTipi==='tane'?(h.taneFiyat||0):'',
        'Piyasa KG':h.girisTipi==='tane'?'':Number((tot.pk||0).toFixed(1)),
        'Aroma KG':h.girisTipi==='tane'?'':Number((tot.ak||0).toFixed(1)),
        'Toplam KG':h.girisTipi==='tane'?'':Number(((tot.pk||0)+(tot.ak||0)).toFixed(1)),
        'Piyasa Fiyat TL/kg':h.girisTipi==='tane'?'':(h.piyasaFiyat||0),
        'Aroma Fiyat TL/kg':h.girisTipi==='tane'?'':(h.aromaFiyat||0),
        'Toplam Gelir TL':Number((tot.gel||0).toFixed(2)),
        'Not':h.not||''
      };
    }).sort(function(a,b){return a['Tarih'].localeCompare(b['Tarih']);});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Hasat');
  }
  if(tip==='gider'||tip==='tamami'){
    var rows2=(V.giderler||[]).map(function(g){
      return {
        'Tarih':g.tarih||'',
        'Kategori':g.kategori||'',
        'Aciklama':g.aciklama||'',
        'Tutar TL':Number(g.tutar||0),
        'Not':g.not||''
      };
    }).sort(function(a,b){return a['Tarih'].localeCompare(b['Tarih']);});
    var cavOd=((V.isci&&V.isci.cavusOdemeleri)||[]).map(function(o){
      return {
        'Tarih':o.tarih?o.tarih.split('T')[0]:'',
        'Kategori':'Isci-Cavus',
        'Aciklama':'Cavus Odemesi'+(o.not?' - '+o.not:''),
        'Tutar TL':Number(o.tutar||0),
        'Not':''
      };
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows2.concat(cavOd)),'Gider');
  }
  if(tip==='isci'||tip==='tamami'){
    var iv=V.isci||{};
    var isciList=iv.isciler||[];
    var devamlar=iv.devamlar||[];
    var rows3=devamlar.map(function(d){
      var isc=null;
      for(var i=0;i<isciList.length;i++){if(isciList[i].id===d.isciId){isc=isciList[i];break;}}
      return {
        'Tarih':d.tarih?d.tarih.split('T')[0]:'',
        'Isci Adi':isc?isc.ad:d.isciId,
        'Ucret TL':Number(d.uygulanenUcret||0)
      };
    }).sort(function(a,b){return a['Tarih'].localeCompare(b['Tarih']);});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows3),'Isci Devam');
  }
  if(tip==='ilac'||tip==='tamami'){
    var rows4=((V.ilac&&V.ilac.kayitlar)||[]).map(function(k){
      var ilaclar=(k.ilaclar||[]).filter(function(x){return x.ad;}).map(function(x){var etkenStr=x.etkens&&x.etkens.length?x.etkens.join('+'):x.ad;return x.ticari?x.ticari+' ('+etkenStr+')':etkenStr;}).join(' + ');
      return {
        'Tarih':k.tarih||'',
        'Tarla':k.tarla||'',
        'Meyve Turu':k.meyveTuru||'',
        'Etken Maddeler':ilaclar,
        'Su Miktari lt':k.su||'',
        'Not':k.not||''
      };
    }).sort(function(a,b){return a['Tarih'].localeCompare(b['Tarih']);});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows4),'Ilac');
  }
  if(tip==='tamami'&&tl.length){
    var rows5=tl.map(function(t){
      return {'Tarla Adi':t.ad,'Meyve':t.meyve||'','Agac Sayisi':t.agacSayisi||0,'Donum':t.donum||0,'Not':t.not||''};
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows5),'Tarlalar');
  }

  if(wb.SheetNames.length===0){toast('Aktar edilecek kayit yok');return;}

  var dosyaAdi='CiftciTakip_'+tip+'_'+tarih+'.xlsx';
  try{
    var wbout=XLSX.write(wb,{bookType:'xlsx',type:'base64'});
    if(window.Android&&Android.saveExcel){
      var sonuc=Android.saveExcel(wbout,dosyaAdi);
      if(sonuc.indexOf('OK')===0)toast('Downloads/'+dosyaAdi+' kaydedildi!');
      else toast(sonuc);
    } else {
      toast('Excel kaydetme desteklenmiyor');
    }
  }catch(e){toast('Excel hatasi: '+e.message);}
}

    toast=function(msg){
      if(DIL==='en'&&msg){
        if(CEVIRI_HARF[msg])msg=CEVIRI_HARF[msg];
        else {
          // Onek eslesmesi (orn: "Tarla eklendi: Kuzey" gibi)
          var keys=Object.keys(CEVIRI_HARF);
          for(var i=0;i<keys.length;i++){
            if(keys[i].length>=6&&msg.indexOf(keys[i])===0){
              msg=CEVIRI_HARF[keys[i]]+msg.substring(keys[i].length);
              break;
            }
          }
        }
      }
      _toast(msg);
    };
  }
  // alert() ve confirm() native dialog'larini da cevir
  function _ceviriDialogMsg(msg){
    if(DIL!=='en'||!msg)return msg;
    if(CEVIRI_HARF[msg])return CEVIRI_HARF[msg];
    var keys=Object.keys(CEVIRI_HARF);
    for(var i=0;i<keys.length;i++){
      if(keys[i].length>=10&&msg.indexOf(keys[i])===0){
        return CEVIRI_HARF[keys[i]]+msg.substring(keys[i].length);
      }
    }
    return msg;
  }
  var _origAlert=window.alert;
  window.alert=function(msg){return _origAlert(_ceviriDialogMsg(msg));};
  var _origConfirm=window.confirm;
  window.confirm=function(msg){return _origConfirm(_ceviriDialogMsg(msg));};
})();

function p8() {
  document.getElementById('sub').textContent = 'Raporlar';
  var h = V.hasatKayitlari || [], g = V.giderler || [];
  var tl = V.tarlalar || [];
  var bugun = new Date(), yil = bugun.getFullYear().toString();
  var ay = bugun.getMonth() + 1;
  var bugunStr = bugun.toISOString().substring(0, 10);
  var ayBas = bugunStr.substring(0, 7);
  var haftaBas = new Date(bugun);
  haftaBas.setDate(bugun.getDate() - ((bugun.getDay() + 6) % 7));
  var haftaBasStr = haftaBas.toISOString().substring(0, 10);
  var haftaBit = new Date(haftaBas); haftaBit.setDate(haftaBas.getDate() + 6);
  var haftaBitStr = haftaBit.toISOString().substring(0, 10);
  var sezonAylar = ay<=3?['01','02','03']:ay<=6?['04','05','06']:ay<=9?['07','08','09']:['10','11','12'];
  var sezonAdi = ay<=3?'Kış':ay<=6?'İlkbahar':ay<=9?'Yaz':'Sonbahar';

  function filtreAralik(arr,bas,bit){return arr.filter(function(x){return x.tarih&&x.tarih>=bas&&x.tarih<=bit;});}
  function filtreAy(arr){return arr.filter(function(x){return x.tarih&&x.tarih.startsWith(ayBas);});}
  function filtreSezon(arr){return arr.filter(function(x){return x.tarih&&sezonAylar.some(function(m){return x.tarih.startsWith(yil+'-'+m);});});}

  var sH,sG,sBaslik;
  if(window.raporSezon===1){sH=filtreAy(h);sG=filtreAy(g);sBaslik='📅 Bu Ay ('+ayBas+')';}
  else if(window.raporSezon===2){
    sH=h.filter(function(x){return x.tarih&&x.tarih.startsWith(yil);});
    sG=g.filter(function(x){return x.tarih&&x.tarih.startsWith(yil);});
    sBaslik='📅 '+yil+' Yili';
  }
  else if(window.raporSezon===3){sH=filtreSezon(h);sG=filtreSezon(g);sBaslik='🍂 '+sezonAdi+' '+yil;}
  else{sH=filtreAralik(h,haftaBasStr,haftaBitStr);sG=filtreAralik(g,haftaBasStr,haftaBitStr);sBaslik='📆 Bu Hafta';}

  function hes(hs,gs){
    return {
      kg:hs.reduce(function(s,x){return s+(parseFloat(x.kg)||0);},0),
      gelir:hs.reduce(function(s,x){var t=getToplam(x);return s+t.gel;},0),

    '</div>';
  }

  // Tarla döküm

  var tarlaVar=false;
  tl.forEach(function(t){
    var tH=sH.filter(function(x){return x.tarla===t.ad;});
    var tG=sG.filter(function(x){return x.tarla===t.ad;});

    tarlaVar=true;
    var c=hes(tH,tG); var kar=c.gelir-c.gid;
    tarlaHtml+='<div style="padding:10px 0;border-bottom:1px solid #f0f0f0">'+
      '<div style="font-weight:700;margin-bottom:5px">🌿 '+t.ad+'</div>'+
      '<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:13px">'+
        '<span>Gelir:<b style="color:#27ae60"> '+f(c.gelir)+'</b></span>'+
        '<span>Gider:<b style="color:#e74c3c"> '+f(c.gid)+'</b></span>'+
        '<span>Kâr:<b style="color:'+(kar>=0?'#27ae60':'#e74c3c')+'"> '+f(kar)+'</b></span>'+
        '<span>'+c.kg.toFixed(1)+' kg</span>'+
      '</div></div>';
  });
  if(!tarlaVar) tarlaHtml+='<p style="color:#bbb;text-align:center;font-size:13px;padding:8px">Bu dönemde tarla kaydı yok</p>';
  tarlaHtml+='</div>';

  // Gider kırılımı
  var katGrup={};

  });}
  katHtml+='</div>';

  var btn=function(txt,bg,fg,act,extraStyle){
    return '<button onclick="hesapBtn(\''+act+'\')" style="padding:18px 0;border:none;border-radius:10px;font-size:20px;font-weight:600;cursor:pointer;background:'+bg+';color:'+fg+';-webkit-tap-highlight-color:transparent;'+(extraStyle||'')+'">'+txt+'</button>';

    btn('7','#ecf0f1','#222','7')+btn('8','#ecf0f1','#222','8')+btn('9','#ecf0f1','#222','9')+btn('×','#f39c12','#fff','*')+
    btn('4','#ecf0f1','#222','4')+btn('5','#ecf0f1','#222','5')+btn('6','#ecf0f1','#222','6')+btn('−','#f39c12','#fff','-')+
    btn('1','#ecf0f1','#222','1')+btn('2','#ecf0f1','#222','2')+btn('3','#ecf0f1','#222','3')+btn('+','#f39c12','#fff','+')+

function _hesapGuncelle(){
  var ek=document.getElementById('hesapEkran');
  if(ek)ek.textContent=_hesapBuf;
  var hf=document.getElementById('hesapHafizaEt');
  if(hf)hf.textContent=(_hesapHafiza?(DIL==='en'?'Memory: ':'Hafiza: ')+_hesapHafiza:'');
}
function hesapBtn(a){
  if(a==='AC'){_hesapBuf='0';_hesapOnceki=null;_hesapOp=null;_hesapYeni=true;_hesapGuncelle();return;}
  if(a==='sign'){if(_hesapBuf.charAt(0)==='-')_hesapBuf=_hesapBuf.substring(1);else if(_hesapBuf!=='0')_hesapBuf='-'+_hesapBuf;_hesapGuncelle();return;}
  if(a==='pct'){var v=parseFloat(_hesapBuf)||0;_hesapBuf=String(v/100);_hesapGuncelle();return;}
  if(a==='mplus'){_hesapHafiza+=(parseFloat(_hesapBuf)||0);_hesapGuncelle();return;}
  if(a==='+'||a==='-'||a==='*'||a==='/'){
    if(_hesapOp&&!_hesapYeni)_hesapHesapla();
    _hesapOnceki=parseFloat(_hesapBuf)||0;
    _hesapOp=a;
    _hesapYeni=true;
    return;
  }
  if(a==='='){_hesapHesapla();_hesapOp=null;return;}
  if(a==='.'){
    if(_hesapYeni){_hesapBuf='0.';_hesapYeni=false;}
    else if(_hesapBuf.indexOf('.')<0)_hesapBuf+='.';
    _hesapGuncelle();return;
  }
  // Sayi tusu
  if(_hesapYeni){_hesapBuf=a;_hesapYeni=false;}
  else {if(_hesapBuf.length>=15)return;_hesapBuf=(_hesapBuf==='0'?'':_hesapBuf)+a;}
  _hesapGuncelle();
}
function _hesapHesapla(){
  if(_hesapOp===null||_hesapOnceki===null){return;}
  var b=parseFloat(_hesapBuf)||0;
  var sonuc;
  switch(_hesapOp){
    case '+': sonuc=_hesapOnceki+b; break;
    case '-': sonuc=_hesapOnceki-b; break;
    case '*': sonuc=_hesapOnceki*b; break;
    case '/': sonuc=b===0?0:(_hesapOnceki/b); break;
    default: sonuc=b;
  }
  // 10 basamaktan fazlaysa kisalt
  var s=String(sonuc);
  if(s.length>15)s=sonuc.toPrecision(12).replace(/0+$/,'').replace(/\.$/,'');
  _hesapBuf=s;
  _hesapYeni=true;
  _hesapGuncelle();
}
function hesapTopSu(){
  var sel=document.getElementById('hesapTarla');
  if(!sel)return;
  var idx=+sel.value;
  var t=(V.tarlalar||[])[idx]||{donum:0};
  var donumSu=parseFloat((document.getElementById('hsDonumSu')||{}).value)||0;
  var topEl=document.getElementById('hsTopSu');
  if(topEl&&donumSu>0&&t.donum)topEl.value=(donumSu*t.donum).toFixed(1);
  hesapToplamMl();
}
function hesapDonumSu(){
  var sel=document.getElementById('hesapTarla');
  if(!sel)return;
  var idx=+sel.value;
  var t=(V.tarlalar||[])[idx]||{donum:0};
  var topSu=parseFloat((document.getElementById('hsTopSu')||{}).value)||0;
  var donEl=document.getElementById('hsDonumSu');
  if(donEl&&topSu>0&&t.donum)donEl.value=(topSu/t.donum).toFixed(2);
  hesapToplamMl();
}
function hesapToplamMl(){
  var topSu=parseFloat((document.getElementById('hsTopSu')||{}).value)||0;
  var doz=parseFloat((document.getElementById('hsDoz')||{}).value)||0;
  var el=document.getElementById('hsTopMl');
  if(el)el.value=topSu>0&&doz>0?((topSu/100)*doz).toFixed(2):'';
}

function aramaYap(q){
  q=(q||'').toLowerCase().trim();
  var el=document.getElementById('aramaSonuc');
  if(!el) return;
  if(!q){el.innerHTML='<p style="color:#aaa;text-align:center;padding:28px;font-size:14px">Aramak istediğiniz kelimeyi yazın...</p>';return;}
  var h=V.hasatKayitlari||[],g=V.giderler||[];
  var ilacK=(V.ilac&&V.ilac.kayitlar)||[],gubreK=(V.gubre&&V.gubre.kayitlar)||[];
  var out='';
  function kart(tip,idx,b,a){return '<div onclick="aramaTikla(\''+tip+'\','+idx+')" style="background:#fff;border-radius:10px;padding:12px;margin-bottom:7px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;-webkit-tap-highlight-color:rgba(39,174,96,0.15);transition:background 0.15s" ontouchstart="this.style.background=\'#f0f8f0\'" ontouchend="this.style.background=\'#fff\'"><div style="font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center">'+b+'<span style="color:#27ae60;font-size:16px;flex-shrink:0;margin-left:8px">›</span></div><div style="font-size:12px;color:#888;margin-top:2px">'+a+'</div></div>';}
  function bas(ikon,ad,n){return '<div style="font-size:11px;font-weight:700;color:#888;text-transform:uppercase;margin:10px 0 5px">'+ikon+' '+ad+' ('+n+')</div>';}
  // Orijinal indexleri korumak icin once map sonra filter
  var hRes=h.map(function(x,i){return {x:x,i:i};}).filter(function(o){var x=o.x;return [(x.meyve||''),(x.tarla||''),(x.musteri||''),(x.not||'')].some(function(s){return s.toLowerCase().includes(q);});});
  if(hRes.length){out+=bas('🌾','Hasat',hRes.length);hRes.slice(0,6).forEach(function(o){var x=o.x;out+=kart('hasat',o.i,(x.meyve||'?')+' — '+(x.tarla||'?'),(x.tarih||'')+' · '+(x.kg||0)+' kg · '+f(parseFloat(x.tutar)||0));});if(hRes.length>6)out+='<div style="font-size:12px;color:#aaa;text-align:center;margin-bottom:6px">+'+(hRes.length-6)+' kayıt daha</div>';}
  var gRes=g.map(function(x,i){return {x:x,i:i};}).filter(function(o){var x=o.x;return [(x.kategori||''),(x.aciklama||''),(x.tarla||'')].some(function(s){return s.toLowerCase().includes(q);});});
  if(gRes.length){out+=bas('💸','Gider',gRes.length);gRes.slice(0,6).forEach(function(o){var x=o.x;out+=kart('gider',o.i,(x.kategori||'?')+(x.tarla?' · '+x.tarla:''),(x.tarih||'')+' · '+f(parseFloat(x.tutar)||0)+(x.aciklama?' · '+x.aciklama:''));});if(gRes.length>6)out+='<div style="font-size:12px;color:#aaa;text-align:center;margin-bottom:6px">+'+(gRes.length-6)+' kayıt daha</div>';}
  var iRes=ilacK.map(function(x,i){return {x:x,i:i};}).filter(function(o){var x=o.x;return [(x.ilac||''),(x.tarla||''),(x.not||'')].some(function(s){return s.toLowerCase().includes(q);});});
  if(iRes.length){out+=bas('🧪','İlaç',iRes.length);iRes.slice(0,4).forEach(function(o){var x=o.x;out+=kart('ilac',o.i,(x.ilac||'?')+' — '+(x.tarla||'?'),x.tarih||'');});}
  var gbrRes=gubreK.map(function(x,i){return {x:x,i:i};}).filter(function(o){var x=o.x;return [(x.urun||''),(x.tarla||'')].some(function(s){return s.toLowerCase().includes(q);});});
  if(gbrRes.length){out+=bas('🌱','Gübre',gbrRes.length);gbrRes.slice(0,4).forEach(function(o){var x=o.x;out+=kart('gubre',o.i,(x.urun||'?')+' — '+(x.tarla||'?'),(x.tarih||'')+' · '+(x.doz||'')+' '+(x.birim||''));});}
  if(!out) out='<p style="color:#aaa;text-align:center;padding:28px;font-size:14px">&#34;'+q+'&#34; için sonuç bulunamadı</p>';
  el.innerHTML=out;
}

function ilacPlan(){
  // Sadece aktif yılın kayıtları - çift sayım önle
  var kayitlar=(V.ilac&&V.ilac.kayitlar)||[];
  var g={};
  var _grupSu={};
  kayitlar.forEach(function(k){
    if(!k)return;
    var su=Math.round(parseFloat(k.su)||0);
    var il=k.ilaclar&&k.ilaclar.length?k.ilaclar:(k.ilac?[{ad:k.ilac,doz100:parseFloat(k.doz100)||0}]:[]);
    il.forEach(function(x){
      var etken=typeof x==='string'?x:((x&&x.etkens&&x.etkens.length)?x.etkens.join('+'): (x&&x.ad?x.ad:''));
      var ticari=typeof x==='object'&&x.ticari?x.ticari:'';
      // Görüntü adı: ticari varsa "Ticari (Etken)", yoksa "Etken"
      var ad=ticari?(ticari+' ('+etken+')'):(etken?etken:'');
      if(!ad)return;
      var d=parseFloat(typeof x==='object'?(x.doz100||x.doz||0):0);
      var ml=su>0&&d>0?(su/100*d):0;
      if(!g[ad])g[ad]={ml:0,lt:0,n:0};
      g[ad].ml+=ml;g[ad].lt+=su;g[ad].n++;
    });
  });
  window._IML={};
  var sirali=Object.keys(g).sort(function(a,b){return g[b].lt-g[a].lt;});
  if(!sirali.length){toast('Ilac kaydi yok');return;}
  var rows='';
  sirali.forEach(function(ad,i){
    var gg=g[ad];
    window._IML[''+i]=gg.ml;
    var gstr=gg.ml>=1000?(gg.ml/1000).toFixed(2)+' kg':Math.round(gg.ml)+' ml';
    rows+='<div style="background:#f8f9fa;border-radius:10px;padding:12px;margin-bottom:10px">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">'+
        '<b style="font-size:15px;flex:1">'+ad+'</b>'+
        '<div style="text-align:right">'+
          '<div style="font-size:16px;font-weight:700;color:#8e44ad">'+(gg.ml>0?gstr:'Doz girilmemis')+'</div>'+
          '<div style="font-size:11px;color:#aaa">'+Math.round(gg.lt)+'lt | '+gg.n+' kayit</div>'+
        '</div>'+
      '</div>'+
      (gg.ml>0?
        '<div style="display:flex;gap:6px">'+
          '<input type="number" id="ha'+i+'" placeholder="Ambalaj" min="0" style="flex:1;padding:8px;border:1.5px solid #ddd;border-radius:8px;font-size:13px">'+
          '<select id="bi'+i+'" style="padding:8px;border:1.5px solid #ddd;border-radius:8px;font-size:13px"><option value="ml">ml</option><option value="lt">lt</option><option value="gr">gr</option><option value="kg">kg</option></select>'+
          '<button onclick="_ihesap('+i+')" style="padding:8px 12px;border:none;border-radius:8px;background:#27ae60;color:#fff;font-weight:700;cursor:pointer">Hesapla</button>'+
        '</div>'+
        '<div id="sr'+i+'" style="margin-top:6px;font-size:13px;color:#8e44ad;font-weight:700"></div>'
      :'<p style="color:#e67e22;font-size:12px;margin:4px 0">Etken madde dozu girilmeli.</p>')+
    '</div>';
  });
  OM2('<div style="flex:1;overflow-y:auto;padding:4px 0"><h2 style="margin:0 0 4px">Ilac Kullanim Analizi</h2><p style="font-size:12px;color:#888;margin-bottom:12px">Toplam kullanilan ilac. Ambalaj girerek kac adet kullanildigini hesapla.</p>'+rows+'</div>');
}

function _ihesap(i){
  var ml=(window._IML&&window._IML[''+i])||0;
  var h=parseFloat((document.getElementById('ha'+i)||{}).value)||0;
  var b=((document.getElementById('bi'+i)||{}).value)||'ml';
  var s=document.getElementById('sr'+i);
  if(!h){toast('Ambalaj gir!');return;}
  if(!ml){toast('Doz girilmemis!');return;}
  var hml=b==='lt'||b==='kg'?h*1000:h;
  var a=Math.ceil(ml/hml);
  var ts=ml>=1000?(ml/1000).toFixed(2)+'kg':Math.round(ml)+'ml';
  if(s)s.innerHTML='<b>'+a+' ambalaj</b> ('+ts+' / '+h+b+')';
}

  ekler.push(ad);

  // MEYVELER listesini güncelle
  MEYVELER.splice(MEYVELER.length-1,0,ad); // 'diger'den önce ekle
  toast(ad+' eklendi!');
  ozelUrunYonet();
}

function ozelUrunSil(idx){
  var ekler=JSON.parse(localStorage.getItem('ozelMeyveler')||'[]');
  var silinen=ekler[idx];
  ekler.splice(idx,1);
  localStorage.setItem('ozelMeyveler',JSON.stringify(ekler));

  if(mi>=0)MEYVELER.splice(mi,1);

  ozelUrunYonet();
}


// Telefona kaydet / yükle
function telefonYedekAl(){
  var json=JSON.stringify(V,null,2);
  var tarih=new Date().toISOString().substring(0,10);
  var dosyaAdi='CiftciTakip_'+tarih+'.json';
  // Android bridge ile Downloads klasorune kaydet
  if(window.Android&&Android.saveFile){
    try{
      // UTF-8 stringi Base64'e cevir (Turkce karakter destegi)
      var b64=_strToBase64(json);
      var sonuc=Android.saveFile(b64,dosyaAdi,'application/json');
      if(sonuc&&sonuc.indexOf('OK:')===0){
        toast('Indirilenler/'+dosyaAdi+' kaydedildi!');
      } else {
        toast('Kaydetme hatasi: '+sonuc);
      }
      return;
    }catch(e){toast('Kayit hatasi: '+e.message);return;}
  }
  // Web fallback (browser preview)
  var blob=new Blob([json],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=dosyaAdi;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  toast('Yedek dosyasi indirildi!');
}

// UTF-8 string -> Base64 (Turkce/emoji guvenli)
function _strToBase64(str){
  // UTF-8 byte array uret, sonra base64
  var bytes=new TextEncoder().encode(str);
  var binary='';
  for(var i=0;i<bytes.length;i++)binary+=String.fromCharCode(bytes[i]);
  return btoa(binary);
}

// ═══ Hava Durumu (Open-Meteo, ucretsiz, anahtar gerekmez) ═══
var _havaCache=null; // {ts, lat, lon, data, city}
var _havaYukleniyor=false;
function havaDurumuYukle(zorla){
  if(_havaYukleniyor)return;
  // Cache: son 30 dakika icinde alindiysa tekrar gosterme
  var simdi=Date.now();
  if(!zorla&&_havaCache&&(simdi-_havaCache.ts)<30*60*1000){
    _havaRender(_havaCache);
    return;
  }
  if(!navigator.geolocation){_havaHata('Konum servisi desteklenmiyor');return;}
  _havaYukleniyor=true;
  _havaDurumGoster('Konum aliniyor...');
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude.toFixed(3);
    var lon=pos.coords.longitude.toFixed(3);
    _havaDurumGoster('Hava durumu aliniyor...');
    // Open-Meteo API - anahtarsiz, saatlik + 7 gunluk + UV + gun dogusu/batisi
    var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
      '&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,apparent_temperature,is_day'+
      '&hourly=temperature_2m,weather_code,is_day&forecast_hours=24'+
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max'+
      '&timezone=auto&forecast_days=7';
    fetch(url).then(function(r){return r.json();}).then(function(d){
      // Sehir adi (BigDataCloud, anahtarsiz)
      fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lon+'&localityLanguage='+(DIL==='en'?'en':'tr'))
        .then(function(r){return r.json();}).catch(function(){return {};}).then(function(g){
          var city=(g.city||g.locality||g.principalSubdivision||(DIL==='en'?'Your Location':'Konumum'));
          _havaCache={ts:simdi,lat:lat,lon:lon,data:d,city:city};
          _havaYukleniyor=false;
          _havaRender(_havaCache);
        });
    }).catch(function(e){
      _havaYukleniyor=false;
      _havaHata((DIL==='en'?'Weather unavailable: ':'Hava durumu alinamadi: ')+(e.message||e));
    });
  },function(err){
    _havaYukleniyor=false;
    var msg=DIL==='en'?'Location permission denied or unavailable':'Konum izni reddedildi veya alinamadi';
    if(err.code===1)msg=DIL==='en'?'Location permission denied':'Konum izni reddedildi';
    else if(err.code===2)msg=DIL==='en'?'Location unavailable':'Konum alinamadi';
    else if(err.code===3)msg=DIL==='en'?'Location timeout':'Konum zaman asimi';
    _havaHata(msg);
  },{enableHighAccuracy:false,timeout:15000,maximumAge:5*60*1000});
}
function _havaDurumGoster(msg){
  var k=document.getElementById('havaIcerik');
  if(k)k.innerHTML='<div style="text-align:center;width:100%;padding:20px;font-size:13px;opacity:0.9">'+msg+'</div>';
}
function _havaHata(msg){
  var k=document.getElementById('havaIcerik');
  if(!k)return;
  k.innerHTML='<div style="text-align:center;width:100%">'+
    '<div style="font-size:32px;margin-bottom:6px">&#9888;&#65039;</div>'+
    '<div style="font-size:12px;opacity:0.9">'+msg+'</div>'+
    '<div style="font-size:11px;opacity:0.7;margin-top:4px">'+(DIL==='en'?'Tap to retry':'Tekrar denemek icin dokun')+'</div>'+
  '</div>';
}
function _havaIkon(code){
  // WMO Weather codes -> emoji
  if(code===0)return '☀️'; // ☀️
  if(code<=3)return '⛅'; // ⛅
  if(code===45||code===48)return '🌫️'; // 🌫️
  if(code>=51&&code<=57)return '🌦️'; // 🌦️
  if(code>=61&&code<=67)return '🌧️'; // 🌧️
  if(code>=71&&code<=77)return '🌨️'; // 🌨️
  if(code>=80&&code<=82)return '🌦️'; // 🌦️
  if(code>=85&&code<=86)return '🌨️'; // 🌨️
  if(code>=95)return '⛈️'; // ⛈️
  return '🌤️'; // 🌤️
}
function _havaText(code){
  var tr={0:'Acik',1:'Az bulutlu',2:'Parcali bulutlu',3:'Bulutlu',45:'Sisli',48:'Sisli',
    51:'Hafif ciseliyor',53:'Ciseliyor',55:'Yogun cisenti',
    61:'Hafif yagmur',63:'Yagmurlu',65:'Siddetli yagmur',
    71:'Hafif kar',73:'Karli',75:'Yogun kar',
    80:'Saganak',81:'Saganak',82:'Siddetli saganak',
    85:'Kar saganagi',86:'Yogun kar saganagi',
    95:'Firtina',96:'Firtina + dolu',99:'Siddetli firtina'};
  var en={0:'Clear',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Foggy',48:'Foggy',
    51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',
    61:'Light rain',63:'Rainy',65:'Heavy rain',
    71:'Light snow',73:'Snowy',75:'Heavy snow',
    80:'Showers',81:'Showers',82:'Heavy showers',
    85:'Snow showers',86:'Heavy snow showers',
    95:'Storm',96:'Storm + hail',99:'Severe storm'};
  var src=DIL==='en'?en:tr;
  return src[code]||(DIL==='en'?'Unknown':'Bilinmiyor');
}
// Dinamik gradient (hava kodu + gece/gunduz)
function _havaArkaplan(kod,gunduz){
  if(!gunduz){
    // Gece
    if(kod>=95)return 'linear-gradient(160deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%)'; // firtina
    if(kod>=51&&kod<=82)return 'linear-gradient(160deg,#1e3c72 0%,#2a5298 100%)'; // yagis
    return 'linear-gradient(160deg,#0f2027 0%,#203a43 50%,#2c5364 100%)'; // gece acik
  }
  // Gunduz
  if(kod===0)return 'linear-gradient(160deg,#56ccf2 0%,#2f80ed 100%)'; // gunesli
  if(kod<=3)return 'linear-gradient(160deg,#6dd5ed 0%,#2193b0 100%)'; // az bulutlu
  if(kod===45||kod===48)return 'linear-gradient(160deg,#bdc3c7 0%,#7f8c8d 100%)'; // sis
  if(kod>=51&&kod<=67)return 'linear-gradient(160deg,#4ca1af 0%,#2c3e50 100%)'; // yagmur
  if(kod>=71&&kod<=86)return 'linear-gradient(160deg,#e6dada 0%,#a8c0c8 100%)'; // kar
  if(kod>=95)return 'linear-gradient(160deg,#373b44 0%,#4286f4 100%)'; // firtina
  return 'linear-gradient(160deg,#4a90e2 0%,#357abd 100%)';
}

// Saat formati: 13:00, 14:00 vb.
function _havaSaat(ts){
  try{var dt=new Date(ts);var h=dt.getHours();return (h<10?'0':'')+h+':00';}catch(e){return ts;}
}
// Gun kisaltma: Pzt, Sal, Car...
function _havaGunAd(ts,i){
  if(i===0)return DIL==='en'?'Today':'Bugun';
  try{
    var dt=new Date(ts);
    return dt.toLocaleDateString(DIL==='en'?'en-US':'tr-TR',{weekday:'short'});
  }catch(e){return ts;}
}

function _havaRender(cache){
  var k=document.getElementById('havaIcerik');

  var hisstaki=Math.round(c.apparent_temperature||sicaklik);
  var nem=Math.round(c.relative_humidity_2m||0);
  var ruzgar=Math.round(c.wind_speed_10m||0);
  var kod=c.weather_code||0;
  var gunduz=c.is_day===1||c.is_day===undefined;
  var aciklama=_havaText(kod);
  var bgHari=_havaArkaplan(kod,gunduz);

  // Karti yenile
